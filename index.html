<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ShopDukaanSe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
/* ShopDukaanSe — central marketplace landing page.
   Flow: pincode -> pick village -> Swiggy/Zomato-style shop cards -> tap a card to go straight to
   THAT shop's own catalogue.html (its own separate Sheet/Script/repo). This page never touches any
   shop's own data — it only reads the central "Shops"/"Pincode_Village"/"Platform" directory.
   Language: English (English script) or Hindi (Devanagari script) — never mixed.
   Location (pincode+village) is remembered in this browser — asked once, not every visit.
   Loved/Bag/My Orders here are cross-shop SHORTCUTS only (each shop keeps its own separate data —
   no shared cart/wishlist). Shops hand off their counts to this page via URL params when a
   customer taps the brand "Home" icon inside a shop; this page just remembers the latest counts
   per shop in ITS OWN storage so it can list "shops with something waiting" and jump back in. */
:root{
  --brandgreen:#0d6758; --wine:#0b574a; --gold:#c08a2e;
  --bg:#fbf4ec; --surface:#ffffff; --fg:#2a1a22; --muted:#7a6a6f; --line:#ece0d4; --chip:#f6ebdd;
  --display:"Yatra One","Mukta",Georgia,serif; --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
#app{max-width:480px;height:100%;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line);position:relative;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.topbar{padding:20px 20px 14px;position:relative}
.topbar .hd{display:flex;align-items:center;justify-content:center;position:relative}
.topbar .brandlogo{display:block;height:32px;width:auto;margin:0 auto}
.topbar p{margin:6px 0 0;color:var(--muted);font-size:13px;text-align:center}
.langtog{position:absolute;right:0;top:0;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langtog button{padding:6px 12px;font-size:12px;font-weight:700;background:none;border:0;color:var(--muted)}
.langtog button.on{background:var(--brandgreen);color:#fff}

.pincodeCard{margin:0 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(30,5,15,.06)}
.pincodeCard label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pinrow{display:flex;gap:8px}
.pinrow input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;letter-spacing:.03em;background:var(--bg)}
.pinrow button{background:var(--brandgreen);color:#fff;border:0;border-radius:12px;padding:0 20px;font-weight:700;font-size:14px}
.pinrow button:disabled{opacity:.5}
.pinhint{font-size:12px;color:var(--muted);margin-top:8px}
.pinhint button{background:none;border:0;padding:0;color:var(--brandgreen);font-weight:700;text-decoration:underline}
.vchips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.vchip.on{background:var(--brandgreen);color:#fff;border-color:var(--brandgreen)}

.locchip{margin:0 16px 10px;display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--brandgreen)}
.locchip button{background:none;border:0;padding:0;color:var(--wine);font-weight:700;text-decoration:underline;font-size:12px}

.searchwrap{margin:0 16px 10px;position:relative}
.searchbar{position:relative}
.searchbar input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 36px;font-size:14px;background:var(--surface);box-shadow:0 2px 8px rgba(30,5,15,.05)}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.searchdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(30,5,15,.12);z-index:20;overflow:hidden}
.searchdrop[hidden]{display:none}
.shit{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.shit b{font-size:14px}
.shit span{font-size:12px;color:var(--muted)}
.seeall{width:100%;padding:10px 14px;border:0;background:var(--chip);text-align:center;font-size:13px;font-weight:700;color:var(--brandgreen)}

.sec-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 16px 8px}

#list{padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}

.shopcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(30,5,15,.07)}
.shopcard .banner{width:100%;height:120px;object-fit:cover;background:var(--chip);display:block}
.shopcard .body{padding:12px 14px 14px}
.shopcard h3{margin:0;font-size:17px;font-weight:800}
.shopcard .tagline{margin:3px 0 0;font-size:13px;color:var(--muted)}
.shopcard .villages{margin:8px 0 0;font-size:12px;color:var(--brandgreen);font-weight:600;display:flex;gap:6px;align-items:flex-start}
.shopcard .villages svg{width:14px;height:14px;flex:0 0 auto;margin-top:2px;stroke:var(--brandgreen);fill:none;stroke-width:2}
.shopcard .go{margin-top:10px;font-size:13px;font-weight:700;color:var(--wine);display:flex;align-items:center;gap:4px}

.state{text-align:center;color:var(--muted);font-size:14px;padding:30px 20px}
.state.err{color:var(--madder,#ab3326)}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brandgreen);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex:0 0 auto}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;top:2px;right:22%;background:var(--gold);color:#2a1d00;font-size:10px;font-weight:700;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tabbar .badge[hidden]{display:none}

.scrim{position:fixed;inset:0;background:rgba(24,8,14,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:41;max-height:75vh;overflow-y:auto}
.sheet h3{margin:4px 0 10px;font-size:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.x{position:absolute;right:14px;top:14px;background:none;border:0;font-size:18px;color:var(--muted)}
.bagrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bagrow:last-child{border:0}
.bagrow b{font-size:14px}
.bagrow span{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.resume{background:var(--brandgreen);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;white-space:nowrap}
</style>
</head>

function t(key){ return STR[LANG][key]; }

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function readJSON(key, fallback){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function writeJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

/* ============== Handoff from a shop's "Home" nav tap ==============
   A shop page navigates here with ?shop=<id>&name=<shop name>&url=<catalogue url>&bag=<n>&
   loved=<n>&orders=<0|1>. We merge that into our own per-shop record so the Loved/Bag/Orders
   shortcuts below know which shops have something waiting. */
(function consumeHandoff(){
  var qp = new URLSearchParams(location.search);
  var shopId = qp.get("shop");
  if(shopId){
    var all = readJSON(SHOPS_KEY, {});
    all[shopId] = {
      name: qp.get("name") || shopId,
      url: qp.get("url") || "",
      bag: Number(qp.get("bag")) || 0,
      loved: Number(qp.get("loved")) || 0,
      orders: qp.get("orders") === "1",
      updatedAt: Date.now()
    };
    writeJSON(SHOPS_KEY, all);
    // Strip the query string so a refresh doesn't reapply stale counts.
    history.replaceState({}, "", location.pathname);
  }
})();

function applyStaticLabels(){
  document.title = "ShopDukaanSe";
  $("#tagline").textContent = t("tagline");
  $("#pinLabel").textContent = t("pin_label");
  $("#pin").placeholder = t("pin_ph");
  $("#goBtn").textContent = t("go");
  $("#pinHintText").textContent = t("pin_hint");
  $("#showAllBtn").textContent = t("show_all");
  $("#shopSearch").placeholder = t("search_ph");
  $("#navLovedLbl").textContent = t("nav_loved");
  $("#navBagLbl").textContent = t("nav_bag");
  $("#navOrdersLbl").textContent = t("nav_orders");
  $("#langHi").classList.toggle("on", LANG==="hi");
  $("#langEn").classList.toggle("on", LANG==="en");
  document.documentElement.lang = LANG;
  renderLocChip();
  renderNavBadges();
}

function renderState(html, cls){
  listEl.innerHTML = '<div class="state' + (cls ? " " + cls : "") + '">' + html + "</div>";
}

var lastShops = [], currentPincode = "", currentVillage = "", villageOptions = [];

/* ============== Pincode -> village step ============== */
function fetchVillages(pincode){
  return fetch(DIRECTORY_API_URL + "?type=villages&pincode=" + encodeURIComponent(pincode))
    .then(function(r){ return r.json(); })
    .then(function(data){ return (data && data.ok) ? (data.villages||[]) : []; })
    .catch(function(){ return []; });
}

function showVillageChips(villages){
  villageOptions = villages;
  var box = $("#vchips");
  if(!villages.length){ box.hidden = true; box.innerHTML=""; return; }
  box.hidden = false;
  box.innerHTML = villages.map(function(v){
    return '<button class="vchip" data-v="'+escapeHtml(v)+'">'+escapeHtml(v)+'</button>';
  }).join("");
}
$("#vchips").onclick = function(e){
  var b = e.target.closest(".vchip"); if(!b) return;
  $("#vchips").querySelectorAll(".vchip").forEach(function(x){ x.classList.toggle("on", x===b); });
  currentVillage = b.dataset.v;
  writeJSON(LOC_KEY, { pincode: currentPincode, village: currentVillage });
  collapseToChip();
  loadShops(currentPincode);
};

function collapseToChip(){
  $("#pincodeCard").hidden = true;
  renderLocChip();
}
function expandPincodeCard(){
  $("#pincodeCard").hidden = false;
  $("#locchipWrap").innerHTML = "";
}
function renderLocChip(){
  if($("#pincodeCard").hidden && currentPincode){
    $("#locchipWrap").innerHTML =
      '<div class="locchip">📍 ' + escapeHtml(currentVillage ? (currentVillage+", "+currentPincode) : currentPincode) +
      ' <button id="chipChange">· ' + t("change") + '</button></div>';
    var b = $("#chipChange"); if(b) b.onclick = function(){ expandPincodeCard(); };
  } else {
    $("#locchipWrap").innerHTML = "";
  }
}

function startPincodeFlow(pincode){
  currentPincode = pincode;
  showVillageChips([]);
  fetchVillages(pincode).then(function(villages){
    if(villages.length){
      showVillageChips(villages);
      renderState("");
      listEl.innerHTML = "";
      labelEl.hidden = true;
      $("#searchwrap").hidden = true;
    } else {
      // No village mapping for this pincode yet — just show shops for the pincode directly.
      currentVillage = "";
      writeJSON(LOC_KEY, { pincode: pincode, village: "" });
      collapseToChip();
      loadShops(pincode);
    }
  });
}

$("#goBtn").onclick = function(){
  var v = $("#pin").value.replace(/\D/g, "");
  if(v.length !== 6){ $("#pin").focus(); return; }
  startPincodeFlow(v);
};
$("#pin").addEventListener("keydown", function(e){ if(e.key === "Enter") $("#goBtn").click(); });
$("#showAllBtn").onclick = function(){
  currentPincode = ""; currentVillage = "";
  expandPincodeCard();
  showVillageChips([]);
  loadShops("");
};

/* ============== Shop list ============== */
function renderShops(shops, pincode, village){
  lastShops = shops;
  labelEl.hidden = false;
  labelEl.textContent = pincode ? t("serving")(village, pincode) : t("all_shops");
  $("#searchwrap").hidden = shops.length === 0;
  if(!shops.length){
    renderState(pincode
      ? t("none_for_pincode") + ' <br><button id="tryAll" style="margin-top:8px;background:none;border:0;color:var(--brandgreen);font-weight:700;text-decoration:underline">' + t("show_all") + '</button>'
      : t("none_listed"));
    if(pincode){ var b=$("#tryAll"); if(b) b.onclick=function(){ $("#showAllBtn").click(); }; }
    return;
  }
  listEl.innerHTML = shops.map(shopCardHTML).join("");
}
function shopCardHTML(s){
  var villages = (s.servesVillages||[]).join(", ");
  var banner = s.bannerUrl ? '<img class="banner" src="'+escapeHtml(s.bannerUrl)+'" alt="">' : "";
  return (
    '<a class="shopcard" href="'+escapeHtml(s.catalogueUrl)+'">' +
      banner +
      '<div class="body">' +
        '<h3>'+escapeHtml(s.name)+'</h3>' +
        (s.tagline ? '<p class="tagline">'+escapeHtml(s.tagline)+'</p>' : '') +
        (villages ? '<p class="villages"><svg viewBox="0 0 24 24"><path d="M12 21s-7-7.2-7-12a7 7 0 1 1 14 0c0 4.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>'+t("delivers_to")+escapeHtml(villages)+'</span></p>' : '') +
        '<div class="go">'+t("view_shop")+' &rarr;</div>' +
      '</div>' +
    '</a>'
  );
}

function loadShops(pincode){
  renderState('<div class="spinner"></div>' + t("loading"));
  labelEl.hidden = true;
  $("#searchwrap").hidden = true;
  if(!DIRECTORY_API_URL || DIRECTORY_API_URL.indexOf("PASTE_YOUR") === 0){
    renderState(t("setup_needed"), "err");
    return;
  }
  var url = DIRECTORY_API_URL + (pincode ? ("?pincode=" + encodeURIComponent(pincode)) : "");
  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if(!data || !data.ok){ renderState(t("generic_error"), "err"); return; }
    renderShops(data.shops || [], pincode, currentVillage);
  }).catch(function(){
    renderState(t("network_error"), "err");
  });
}

/* ============== Shop search (preview 3-4 + "see all", tap-outside closes) ============== */
var SEARCH_PREVIEW_SIZE = 4;
var searchFiltered = null; // non-null once the user has searched, used to override the main list
$("#shopSearch").oninput = function(){
  var q = this.value.trim().toLowerCase();
  var drop = $("#searchdrop");
  if(!q){ drop.hidden = true; if(searchFiltered){ searchFiltered=null; renderShops(lastShops, currentPincode, currentVillage); } return; }
  var matches = lastShops.filter(function(s){ return (s.name||"").toLowerCase().indexOf(q) !== -1; });
  var preview = matches.slice(0, SEARCH_PREVIEW_SIZE);
  if(!preview.length){
    drop.hidden = false;
    drop.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:13px;text-align:center">'+t("none_listed")+'</div>';
    return;
  }
  drop.hidden = false;
  drop.innerHTML = preview.map(function(s){
    return '<button class="shit" data-id="'+escapeHtml(s.shopId)+'"><b>'+escapeHtml(s.name)+'</b>'+(s.tagline?'<span>'+escapeHtml(s.tagline)+'</span>':'')+'</button>';
  }).join("") + (matches.length > preview.length ? '<button class="seeall" data-seeall="1">'+t("see_all_n")(matches.length)+'</button>' : "");
  drop.dataset.matches = JSON.stringify(matches.map(function(s){return s.shopId;}));
  drop._matches = matches;
};
$("#searchdrop").onclick = function(e){
  var seeall = e.target.closest("[data-seeall]");
  if(seeall){
    searchFiltered = this._matches;
    renderShops(searchFiltered, currentPincode, currentVillage);
    this.hidden = true;
    return;
  }
  var b = e.target.closest("[data-id]"); if(!b) return;
  var s = (this._matches||[]).find(function(x){ return x.shopId === b.dataset.id; });
  if(s) location.href = s.catalogueUrl;
};
document.addEventListener("click", function(e){
  if($("#searchdrop").hidden) return;
  if(e.target.closest(".searchwrap")) return;
  $("#searchdrop").hidden = true;
}, {passive:true});

/* ============== Loved / Bag / Orders shortcuts ============== */
function openShopsWithField(field){
  var all = readJSON(SHOPS_KEY, {});
  return Object.keys(all).map(function(id){ return Object.assign({id:id}, all[id]); })
    .filter(function(s){ return field==="orders" ? !!s.orders : (Number(s[field])>0); });
}
function renderNavBadges(){
  var bagShops = openShopsWithField("bag");
  var lovedShops = openShopsWithField("loved");
  var orderShops = openShopsWithField("orders");
  var bagTotal = bagShops.reduce(function(a,s){ return a+Number(s.bag||0); },0);
  var lovedTotal = lovedShops.reduce(function(a,s){ return a+Number(s.loved||0); },0);
  setBadge("#badgeBag", bagTotal);
  setBadge("#badgeLoved", lovedTotal);
  setBadge("#badgeOrders", orderShops.length);
}
function setBadge(sel, n){ var el=$(sel); el.hidden = !n; el.textContent = n; }

function sheet(html){ $("#layer").innerHTML = '<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><button class="x" id="sx">✕</button><div class="grab"></div>'+html+'</div>'; $("#scrim").onclick=closeSheet; $("#sx").onclick=closeSheet; }
function closeSheet(){ $("#layer").innerHTML=""; }

function openShortcutSheet(field, titleKey, emptyKey, resumeParam, countLabel){
  var shops = openShopsWithField(field);
  if(!shops.length){
    sheet('<h3>'+t(titleKey)+'</h3><p style="color:var(--muted);font-size:13.5px">'+t(emptyKey)+'</p>');
    return;
  }
  var rows = shops.map(function(s){
    var sub = field==="orders" ? t("has_orders") : countLabel(Number(s[field]||0));
    var url = s.url + (s.url.indexOf("?")!==-1 ? "&" : "?") + "resume=" + resumeParam;
    return '<div class="bagrow"><div><b>'+escapeHtml(s.name)+'</b><span>'+sub+'</span></div><a class="resume" href="'+escapeHtml(url)+'">'+t("resume")+'</a></div>';
  }).join("");
  sheet('<h3>'+t(titleKey)+'</h3>'+rows);
}

$("#tabbar").onclick = function(e){
  var b = e.target.closest("button[data-tab]"); if(!b) return;
  var tab = b.dataset.tab;
  if(tab==="bag") openShortcutSheet("bag","bag_title","bag_empty","bag",t("items_in_bag"));
  if(tab==="loved") openShortcutSheet("loved","loved_title","loved_empty","loved",t("items_loved"));
  if(tab==="orders") openShortcutSheet("orders","orders_title","orders_empty","orders",function(){return "";});
};

function setLang(lang){
  LANG = lang;
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
  applyStaticLabels();
  if(searchFiltered){ renderShops(searchFiltered, currentPincode, currentVillage); }
  else if(lastShops.length || currentPincode==="" ){ /* no-op: list already rendered, labels refreshed above */ }
}
$("#langHi").onclick = function(){ setLang("hi"); };
$("#langEn").onclick = function(){ setLang("en"); };

/* ============== Boot ============== */
(function boot(){
  applyStaticLabels();
  var qp = new URLSearchParams(location.search);
  var qpPin = (qp.get("pincode")||"").replace(/\D/g,"");
  var saved = readJSON(LOC_KEY, null);
  if(qpPin){
    // A shop's own direct link/QR pre-filling a pincode takes priority over any saved location.
    $("#pin").value = qpPin;
    startPincodeFlow(qpPin);
    return;
  }
  if(saved && saved.pincode){
    currentPincode = saved.pincode; currentVillage = saved.village || "";
    $("#pin").value = saved.pincode;
    collapseToChip();
    loadShops(saved.pincode);
    return;
  }
  // Nothing saved yet — show the pincode card, nothing in the list until they search.
})();
</script>
</body>
</html>
