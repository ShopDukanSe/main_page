   central Directory. Shares localStorage (STORE_KEY, now "sdse_shop_<shop_id>_v1") with

:root{

}

<body>
<div id="app">
  <div class="owner">
    <header>
      <h1>Shop owner</h1>

    <div class="tabs" role="tablist">

<script>
/* ================= Real backend (Google Sheet via Apps Script Web App) ================= */
// Same Directory every shop's catalogue.html and home.html use. Read-only here, just to trade this
// page's ?key= for the right shop's API_URL — see resolveShopFromOwnerKey() below.
const DIRECTORY_API_URL = "https://script.google.com/macros/s/AKfycbyUwJdKLtoOmLYBTKPYkz7Oif0xVjsgq_JTHMzGYl64v64xbr4tsZQ1AnfUHYFy-zI/exec";
// Filled in by resolveShopFromOwnerKey() before anything else runs — see boot() at the bottom.
let SHOP_ID = "";
let API_URL = "";
function apiConfigured(){ return typeof API_URL==="string" && API_URL && !API_URL.includes("PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"); }
/* Reads ?key=<owner_key> (a private secret — NOT the public shop_id used in catalogue.html's URL)
   and trades it, via the central Directory, for this shop's shop_id + its own api_url. This is what
   keeps the admin console private now that owner.html is one shared page for every shop: the key is
   a long random token nobody can guess, unlike a shop_id which is already public in the customer
   catalogue link. Must finish before loadFromApi() (needs API_URL) or anything touches STORE_KEY —
   it's the very first thing boot() awaits. Shows a plain message and stops on a missing/bad key. */
async function resolveShopFromOwnerKey(){
  const qp = new URLSearchParams(location.search);
  const key = (qp.get("key") || "").trim();
  function fail(msg){
    document.body.innerHTML = '<div style="max-width:420px;margin:60px auto;padding:0 24px;text-align:center;font-family:sans-serif;color:#555;line-height:1.5"><p>' + msg + '</p></div>';
  }
  if(!key){ fail("This admin link is missing its access key. Use the private link your shop was given."); throw new Error("no ?key= in URL"); }
  let data;
  try{
    const res = await fetch(DIRECTORY_API_URL + "?type=ownerLookup&key=" + encodeURIComponent(key));
    data = await res.json();
  }catch(e){ /* fall through to the generic message below */ }
  if(!data || !data.ok){ fail("This admin link isn't valid right now. Check the link or try again in a moment."); throw new Error("ownerLookup failed for the given key"); }
  SHOP_ID = data.shopId;
  API_URL = data.apiUrl || "";
}
/* Owner console needs Orders/Issues too, which the public action=all deliberately omits
   (it's callable by anyone who finds API_URL in the page source). This page always uses the
   action=ownerAll endpoint instead — there's no login/passcode anymore, access is controlled
   purely by this page's own URL being unlisted/unshared. */
async function apiGetAll(){
  const url = API_URL + (API_URL.includes("?")?"&":"?") + "action=ownerAll";
  const res = await fetch(url);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
/* Sent as GET (not POST) — Apps Script Web App POST responses often come back without an
   Access-Control-Allow-Origin header once this page is hosted on a different origin (e.g.
   GitHub Pages), so the browser blocks reading the response even though the call succeeds
   server-side. GET doesn't have this problem, so the action+payload travels as a JSON query param. */
async function apiPost(action, payload){
  const url = API_URL + (API_URL.includes("?")?"&":"?") + "action=" + encodeURIComponent(action) + "&data=" + encodeURIComponent(JSON.stringify(Object.assign({action}, payload)));
  const res = await fetch(url);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
/* No login anymore — owner-mutating actions used to carry a phone+passcode for Code.gs to
   verify; that check is now disabled server-side (requireOwner_ in Code.gs), so this just
   calls apiPost directly and swallows a failure (change still kept locally either way). */
async function apiPostSafe(action, payload, failMsg){
  if(!apiConfigured()) return null;
  try{ return await apiPost(action, payload); }
  catch(err){ console.warn("ShopDukaanSe owner: "+action+" API failed — change kept locally only.", err); if(failMsg) toast(failMsg); return null; }
}
/* Every save in this app used to toast "saved" the instant you changed something locally,
   before the network call even finished — so it said "saved" whether or not it actually
   reached the sheet. This waits for the real result and only then shows ONE honest toast. */
async function apiPostConfirmed(action, payload, okMsg, failMsg){
  if(!apiConfigured()){ toast(okMsg+" (local demo — connect the backend to go live)"); return true; }
  const res = await apiPostSafe(action, payload);
  toast(res ? okMsg : (failMsg || "Couldn't reach the backend — kept locally only, try again"));
  return !!res;
}
/* A base64 image (banner photo) is far too big for a URL query string (the GET approach above
   silently fails or gets truncated past a few KB) — this sends it as a real POST body instead.
   mode:"no-cors" + text/plain avoids both the CORS-preflight problem AND the CORS-response
   problem noted above: the request reaches Code.gs and executes fine, we just can't read its
   reply, so this is fire-and-forget (no error is ever thrown — treat the call as "sent"). */
function apiPostBig(action, payload){
  if(!apiConfigured()) return;
  return fetch(API_URL, {
    method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({action}, payload))
  }).catch(err=>console.warn("ShopDukaanSe owner: "+action+" (big) API failed — change kept locally only.", err));
}

/* Resizes/compresses an uploaded image to a small JPEG data URL — keeps it well under Google
   Sheets' ~50,000-char-per-cell limit once base64-encoded (a full-res phone photo blows past
   that easily). Used for banner uploads here; catalogue.html has the same helper for payment
   screenshots and issue photos. */
function resizeImageFile_(file, maxDim=900, quality=0.6){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
        const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ================= Shared config (must match catalogue.html's shapes exactly) ================= */
// Generic placeholders — overwritten per shop by applyRemoteConfig() once that shop's own Config
// sheet loads (same as catalogue.html; this file no longer hardcodes any one shop's details).
let SHOP = { name:"Shop", owner:"", upiId:"", upiName:"", phone:"", email:"", gstin:"" };
function applyRemoteConfig(config){
  if(!config) return;
  if(config.shop_name) SHOP.name=config.shop_name;
  if(config.owner_name) SHOP.owner=config.owner_name;
  if(config.upi_id) SHOP.upiId=config.upi_id;
  if(config.upi_name) SHOP.upiName=config.upi_name;
  if(config.phone) SHOP.phone=config.phone;
  if(config.email) SHOP.email=config.email;
  if(config.gstin) SHOP.gstin=config.gstin;
}
// Must match the formula catalogue.html uses so both apps land on the SAME localStorage for the
// same shop. Set once SHOP_ID resolves (resolveShopFromOwnerKey, above) — see boot() at the bottom.
let STORE_KEY = "sdse_shop__unresolved";
const DEFAULT_CUTOFF_HOUR = 16;
const SHOP_LOC = {lat:22.760, lng:78.357};

const POLICY_LABELS = [
  ["return_policy","Return / exchange policy"],
  ["cancellation_policy","Cancellation policy"],
  ["agree_checkbox","Checkout agreement checkbox text"],
  ["delivery_note","Delivery promise note"],
  ["privacy_title","Privacy sheet title"],
  ["privacy_collect_h","Privacy — 'What we collect' heading"],
  ["privacy_collect","Privacy — 'What we collect' text"],
  ["privacy_rights_h","Privacy — 'Your rights' heading"],

  ["privacy_contact_h","Privacy — contact heading"],

/* Minimal product metadata needed by the owner console (full catalogue — photos/specs/qa — lives in catalogue.html). */
let PRODUCTS = [

function haversineKm(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }

   Orders tab — payment-verification status (Verified/Pending check/...) is owner.html's own local

function mapApiOrder(o){

/* Fetches products/stock/villages/zone/config/policies/orders/issues from the Apps Script backend
   and merges them over the local demo data. Always boots from loadLocal() first so the console
   works before API_URL is deployed or if the fetch fails. */
async function loadFromApi(){
  loadLocal();
  if(!apiConfigured()) return;
  try{
    const data = await apiGetAll();
    if(data.products && data.products.length) PRODUCTS = data.products.map(mapApiProduct);
    if(data.stock && Object.keys(data.stock).length) S.stock = data.stock;
    if(data.villages && data.villages.length) S.config.villages = data.villages;
    if(data.config){
      applyRemoteConfig(data.config);
      if(data.config.cutoff_hour!=null) S.config.cutoffHour = Number(data.config.cutoff_hour)||S.config.cutoffHour;
      [1,2,3].forEach(n=>{

        if(data.config["banner_"+n]!=null) S.config["banner_"+n]=data.config["banner_"+n]; // legacy pre-language key, kept for display until re-saved
      });
    }
    if(data.policies) S.policies = Object.assign({}, POLICY_DEFAULTS, data.policies);
    if(data.orders && data.orders.length){ S.orders = data.orders.map(mapApiOrder); S.baseVotes = S.baseVotes||{}; PRODUCTS.forEach((p,i)=>{ if(!S.baseVotes[p.id]) S.baseVotes[p.id]={like:8+((i*7)%15),dislike:1+((i*3)%5)}; }); }

let invFormState = null; // null = not showing a form; "new" = add-product form; otherwise a product id being edited
function nextProductId(category){
  // Collision-safe scheme: <category initial>-<next unused 3-digit number sharing that initial>,
  // scanning ALL existing product ids (not just this category) so it never collides with a legacy
  // id that happens to share the same first letter (e.g. Kids "K..." vs the legacy Women "K201/K202").
  const prefix = (category||"P").trim().charAt(0).toUpperCase() || "P";
  let maxN = 100;
  PRODUCTS.forEach(p=>{
    const m = String(p.id||"").match(new RegExp("^"+prefix+"(\\d+)$"));
    if(m) maxN = Math.max(maxN, parseInt(m[1],10));
  });
  return prefix + (maxN + 1);
}

        <div id="pfPhotoPreview${i}" style="aspect-ratio:1;background:var(--chip);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center">
          ${photos[i]?`<img src="${photos[i]}" style="width:100%;height:100%;object-fit:cover">`:"No photo"}
        </div>
        <input type="file" accept="image/*" data-photo="${i}" style="margin-top:4px;font-size:11px;width:100%">
      </div>`).join("")}
    </div>
    <label>Specs (one per line, "Key: value")<textarea id="pf-specs" rows="3">${esc(specsText)}</textarea></label>
    <label>FAQ (one per line, "Question | Answer")<textarea id="pf-faq" rows="2">${esc(faqLines)}</textarea></label>
    <div class="err" id="pfErr" style="color:var(--madder);font-size:13px;min-height:1em"></div>
    <div class="oc-row" style="margin-top:6px">
      <button class="cta" type="submit">${editing?"Save changes":"Add product"}</button>
      <button class="small-btn" type="button" id="pfCancel">Cancel</button>
    </div>
  </form>`;
  $("#pfCancel").onclick=()=>{ invFormState=null; wrap.innerHTML=""; };
  // Stock-per-size inputs — regenerated whenever the Sizes field changes, so adding a brand new
  // product also sets its starting stock right here instead of a separate trip to the Inventory
  // table afterwards. Prefilled from S.stock when editing an existing product.
  const existingStock = (p && S.stock[p.id]) || {};
  function renderStockInputs(){
    const sizes = $("#pf-sizes").value.split(",").map(s=>s.trim()).filter(Boolean);
    $("#pfStockWrap").innerHTML = sizes.length ? sizes.map(s=>`<label class="inv-size">${esc(s)}<input type="number" min="0" data-stocksize="${esc(s)}" value="${existingStock[s]??0}"></label>`).join("")
      : `<span style="color:var(--muted);font-size:13px">Enter sizes above first.</span>`;
  }
  renderStockInputs();
  $("#pf-sizes").oninput=renderStockInputs;
  // Staged photo picks (slot index -> resized dataURL), kept only until Save is clicked — then
  // each one is uploaded to Drive separately (see apiPostBig below) rather than stuffed into the
  // main product save, which travels as a small GET request and can't carry a base64 image.
  const pendingPhotos = {};
  const pendingReplace = {}; // slot index -> true if this slot already had a saved photo we're replacing
  wrap.querySelectorAll("[data-photo]").forEach(inp=>{
    inp.onchange=async e=>{
      const i=Number(inp.dataset.photo), f=e.target.files[0]; if(!f) return;
      // If this slot already has a photo saved on the server (not just a pending pick), confirm
      // before replacing it — a confirmed replace also deletes the OLD photo from Drive so they
      // don't pile up there forever.
      if(photos[i]){
        const ok=confirm(`Slot ${i+1} already has a photo. Replace it? (The old photo will be deleted from Drive.)`);
        if(!ok){ inp.value=""; return; }
        pendingReplace[i]=true;
      }
      try{
        const dataUrl = await resizeImageFile_(f, 1600, 0.75);
        pendingPhotos[i]=dataUrl;
        const prev=$("#pfPhotoPreview"+i);
        if(prev) prev.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
      }catch(err){
        console.warn("ShopDukaanSe owner: couldn't read product photo.", err);
        toast("Couldn't read that photo — re-export it as a plain JPG or PNG and try again");
        inp.value="";
      }
    };
  });
  $("#productForm").onsubmit=async e=>{
    e.preventDefault();
    const sizes = $("#pf-sizes").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!sizes.length){ $("#pfErr").textContent="Enter at least one size."; return; }
    const specs={};
    $("#pf-specs").value.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const i=l.indexOf(":"); if(i>-1) specs[l.slice(0,i).trim()]=l.slice(i+1).trim();
    });
    const faq = $("#pf-faq").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const [q,a]=l.split("|"); return [ (q||"").trim(), (a||"").trim() ];
    });
    const cat = $("#pf-cat").value;
    const id = editing ? invFormState : nextProductId(cat);
    const description = $("#pf-desc").value.trim();
    // Keep the EXISTING photo links in the main save — a picked file's data URL is far too big
    // for this GET request (same reasoning as banners) and goes separately below instead.
    const productObj = {
      id, category:cat, subcategory:$("#pf-sub").value.trim(),
      name:$("#pf-name").value.trim(), nameHi:$("#pf-nameHi").value.trim(),
      mrp:Number($("#pf-mrp").value)||0, price:Number($("#pf-price").value)||0, gstRate:Number($("#pf-gst").value)||0,
      sizes, badge:$("#pf-badge").value||undefined, description,
      photos:photos.filter(Boolean),
      specs, faq
    };
    // Optimistic local preview: slots with a freshly picked photo show that photo right away
    // (as the local resized copy), even though the real Drive link only lands after the upload
    // below finishes and the page is reloaded.
    const previewPhotos = [0,1,2,3,4].map(i=>pendingPhotos[i]!==undefined?pendingPhotos[i]:(photos[i]||"")).filter(Boolean);
    const localProduct = { id, name:productObj.name, nameHi:productObj.nameHi, cat, sub:productObj.subcategory, mrp:productObj.mrp, price:productObj.price, gstRate:productObj.gstRate, sizes, badge:productObj.badge, description, photos:previewPhotos, specs, faq };
    const idx = PRODUCTS.findIndex(x=>x.id===id);
    if(idx>-1) PRODUCTS[idx]=localProduct; else PRODUCTS.push(localProduct);
    const stockQty = {};
    wrap.querySelectorAll("[data-stocksize]").forEach(inp=>{ stockQty[inp.dataset.stocksize]=Math.max(0,parseInt(inp.value)||0); });
    S.stock[id] = Object.assign({}, S.stock[id]||{}, stockQty);
    save();
    invFormState=null;
    renderOwner();
    await apiPostConfirmed("updateProduct", {product:productObj}, editing?`${id} updated`:`${id} added`, `${id} saved here, but couldn't reach the sheet — try again`);
    await Promise.all(sizes.map(s=>apiPostSafe("updateStock", {product_id:id, size:s, qty:stockQty[s]})));
    const pendingSlots=Object.keys(pendingPhotos);
    if(pendingSlots.length){
      pendingSlots.forEach(i=>apiPostBig("uploadProductPhoto", {product_id:id, slot:Number(i)+1, data_url:pendingPhotos[i], replace:!!pendingReplace[i]}));
      toast(`Uploading ${pendingSlots.length>1?"photos":"photo"} to Drive — reopen ${id} in about 10 seconds to confirm`);
    }
  };
}

function ownerActionCell(o){
  if(o.stage==="Cancelled") return "—";
  if(o.stage==="Booked" && (o.status==="Verified"||o.status==="COD")) return `<button class="small-btn" data-act="dispatch">Dispatch</button>`;
  if(o.stage==="Booked") return `<span style="color:var(--muted);font-size:12px">Awaiting payment check</span>`;
  if(o.stage==="Dispatched") return `<button class="small-btn" data-act="deliver">Mark delivered</button>`;
  if(o.stage==="Delivered"){ const dl=reportDeadline(o); return dl&&Date.now()<=dl?`<span style="font-size:12px;color:var(--marigold)">Report window ${hoursLeft(dl)}h</span>`:`<span style="font-size:12px;color:var(--muted)">Window closed</span>`; }
  return "";
}
function wireOwnerOrderActions(){
  document.querySelectorAll("#ownerBody tr[data-id]").forEach(tr=>{
    tr.onclick=e=>{
      const act=e.target.closest("[data-act]")?.dataset.act; if(!act) return;
      const o=S.orders.find(x=>x.id===tr.dataset.id);
      if(act==="dispatch"){
        tr.lastElementChild.innerHTML=`<div class="dispatch-box">OTP will be emailed to customer on confirm.<button class="small-btn" data-act="confirmDispatch">Confirm dispatch</button></div>`;
      }
      if(act==="confirmDispatch"){
        o.otp=String(Math.floor(1000+Math.random()*9000));
        o.stage="Dispatched"; o.dispatchedAt=new Date().toISOString(); save(); renderOwner();
        (async()=>{
          const ok = await apiPostConfirmed("updateOrderStatus", {order_id:o.id, status:"Dispatched", otp:o.otp}, "Marked dispatched", "Marked dispatched here, but couldn't update the sheet — try again");
          if(ok) toast(`OTP ${o.otp} emailed to ${o.email}`);
        })();
      }
      if(act==="deliver"){
        tr.lastElementChild.innerHTML=`<div class="dispatch-box"><input placeholder="Enter OTP from customer" data-role="otpIn" style="font-size:12px;padding:6px"><input type="file" accept="image/*" capture="environment" data-role="photoIn" style="font-size:11px"><button class="small-btn" data-act="confirmDeliver">Confirm delivered</button></div>`;
      }
      if(act==="confirmDeliver"){
        const cell=tr.lastElementChild;
        const otpIn=cell.querySelector('[data-role="otpIn"]')?.value.trim();
        if(otpIn!==o.otp){ toast("OTP does not match"); return; }
        const file=cell.querySelector('[data-role="photoIn"]')?.files[0];
        const finish=async photo=>{
          o.deliveryPhoto=photo||null; o.stage="Delivered"; o.deliveredAt=new Date().toISOString(); save(); renderOwner();
          // Photo uploads to Drive (same as banners/product photos) and only the resulting link
          // gets written to delivery_photo_link. Previously this sent the RAW, un-resized camera
          // photo straight into a Sheet cell via attachPhoto — routinely several MB, so it blew
          // past Google Sheets' 50,000-character cell limit on every delivery, silently.
          await apiPostConfirmed("updateOrderStatus", {order_id:o.id, status:"Delivered"}, "Marked delivered", "Marked delivered here, but couldn't update the sheet — try again");
          if(photo) apiPostBig("uploadDeliveryPhoto", {order_id:o.id, data_url:photo});
        };
        if(file){
          (async()=>{
            try{ finish(await resizeImageFile_(file, 1200, 0.7)); }
            catch(err){
              console.warn("ShopDukaanSe owner: couldn't read delivery photo.", err);
              toast("Marked delivered, but couldn't read that photo — the delivery itself is still saved");
              finish(null);
            }
          })();
        } else finish(null);
      }
    };
  });
}
function parseCSV(t){
  return t.trim().split(/\r?\n/).slice(1).map(l=>{const c=l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x=>x.replace(/,$/,"").replace(/^"|"$/g,"").replace(/""/g,'"').trim());
    return {date:c[0],narr:c[1]||"",ref:c[2]||"",credit:parseFloat(String(c[3]||"0").replace(/[₹,\s]/g,""))||0}}).filter(r=>r.date);
}

function runMatch(quiet){
  const used=new Set(); let v=0,mm=0,nf=0;
  S.orders.filter(o=>o.mode==="UPI"&&o.status!=="Verified"&&o.stage!=="Cancelled").forEach(o=>{
    const hit=stmt.find((r,i)=>!used.has(i)&&((o.utr&&(r.ref.includes(o.utr)||r.narr.includes(o.utr)))||r.narr.includes(o.id)));
    if(hit){used.add(stmt.indexOf(hit)); if(Math.abs(hit.credit-o.amount)<1){o.status="Verified";v++;apiPostSafe("verifyPayment",{utr:o.utr||hit.ref||"",matched_order_id:o.id,status:"Matched"})}else{o.status="Amount mismatch";o.paid=hit.credit;mm++;apiPostSafe("verifyPayment",{utr:o.utr||hit.ref||"",matched_order_id:o.id,status:"Unmatched — amount differs, check manually"})}}
    else if(o.utr){o.status="Not found";nf++}
  });
  save();
  const pend=S.orders.filter(o=>o.mode==="UPI"&&o.status!=="Verified"&&o.stage!=="Cancelled");
  $("#mres").innerHTML=`${quiet?"":`<div class="kpis" style="margin-top:12px"><div class="kpi"><b>${v}</b><span>Verified</span></div><div class="kpi"><b>${mm}</b><span>Amount mismatch</span></div><div class="kpi"><b>${nf}</b><span>Not found</span></div></div>`}
   <p class="sec-label" style="margin-top:14px">Needs a manual check (${pend.length})</p>
   ${pend.map(o=>{const cand=stmt.filter(r=>Math.abs(r.credit-o.amount)<1);return `<div class="note" style="margin-bottom:8px"><b>${o.id}</b> · ${esc(o.name)} · ${rs(o.amount)} · UTR ${o.utr||"—"} <span class="pill ${pillFor(o.status)}">${o.status}${o.paid?` (got ${rs(o.paid)})`:""}</span>
     ${o.paymentScreenshot?`<div style="margin-top:6px"><img src="${o.paymentScreenshot}" style="max-width:140px;border-radius:8px;cursor:zoom-in" data-shotzoom></div>`:""}
     <div style="margin-top:6px;font-size:13px;color:var(--muted)">${cand.length?`Statement credits of ${rs(o.amount)}:`:"No statement credit of the same amount."}</div>
     ${cand.map(r=>`<div style="font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px"><span style="min-width:0;overflow-wrap:anywhere">${esc(r.date)} · ${esc(r.narr)}</span><button class="small-btn" data-ver="${o.id}">Mark verified</button></div>`).join("")}
     <div style="margin-top:6px"><button class="small-btn" data-ver="${o.id}">Verified manually</button></div></div>`}).join("")||`<p style="color:var(--muted)">All UPI orders verified.</p>`}`;
  $("#mres").querySelectorAll("[data-shotzoom]").forEach(img=>{
    img.onclick=()=>{ const big=img.style.maxWidth!=="100%"; img.style.maxWidth=big?"100%":"140px"; img.style.cursor=big?"zoom-out":"zoom-in"; };
  });
  $("#mres").onclick=async e=>{const b=e.target.closest("[data-ver]");if(!b)return;const o=S.orders.find(x=>x.id===b.dataset.ver);o.status="Verified";o.manual=true;save();runMatch(true);await apiPostConfirmed("verifyPayment",{utr:o.utr||"",matched_order_id:o.id,status:"Matched"},`${o.id} marked verified`,`${o.id} marked verified here, but couldn't save to the sheet — try again`)};
}

    <label style="max-width:220px">Same-day order cutoff (24h hour)

      <td><input data-f="radiusKm" type="number" step="0.1" min="0" value="${v.radiusKm??""}" style="width:80px"></td>
      <td><select data-f="tier">
        <option value="same" ${v.tier==="same"?"selected":""}>same-day</option>
        <option value="next" ${v.tier==="next"?"selected":""}>next-day</option>
        <option value="next2" ${v.tier==="next2"?"selected":""}>2-day</option>
        <option value="other" ${v.tier==="other"?"selected":""}>not covered</option>
      </select></td>
      <td><button class="small-btn danger" data-del="${i}">Remove</button></td>
    </tr>`).join("")}
    </tbody></table></div>
    <button class="small-btn" id="addVillage" style="margin-top:8px">+ Add village</button>
    <div class="oc-row" style="margin-top:10px">
      <button class="cta" id="saveRules" style="padding:8px 16px;font-size:13px">Save delivery rules</button>
    </div>

    <p class="sec-label" style="margin-top:28px">Home screen banners (up to 3 each — set separately for English and Hindi)</p>
    <div class="zone-note">Images look best at <b>1200 × 500px</b> (landscape, 12:5 ratio) — upload at that size for no cropping. A different size still works, we'll auto-fit it to this shape. Leave a slot empty to not show a banner there. Customers see whichever language they've picked — if you only fill in one language, that one shows for everybody until you add the other. Pick your photos, then click <b>Save banners</b> once — they don't go live until you do.</div>
    <p style="font-weight:700;margin:14px 0 4px">English banners</p>
    <div class="oc-row" id="bannerSlots_en" style="align-items:flex-start;gap:16px"></div>
    <p style="font-weight:700;margin:18px 0 4px">Hindi banners (हिंदी बैनर)</p>
    <div class="oc-row" id="bannerSlots_hi" style="align-items:flex-start;gap:16px"></div>
    <div class="oc-row" style="margin-top:10px">
      <button class="cta" id="saveBannersBtn" style="padding:8px 16px;font-size:13px">Save banners</button>
    </div>`;
  const BANNER_LANGS=["en","hi"];
  const pendingBanners = new Set(); // "slot_lang" keys changed since the last Save click, e.g. "1_en"
  function bannerKey(n,lang){ return "banner_"+n+"_"+lang; }
  function renderBannerSlots(){
    BANNER_LANGS.forEach(lang=>{
      const wrap=$("#bannerSlots_"+lang); if(!wrap) return;
      wrap.innerHTML=[1,2,3].map(n=>{
        const key=bannerKey(n,lang);
        // Falls back to the old pre-language banner_<n> value so whatever was already uploaded
        // keeps showing here (for English, which was the only one that existed before) until
        // it's replaced or removed.
        const cur=S.config[key] || (lang==="en" ? (S.config["banner_"+n]||"") : "");
        const pk=n+"_"+lang;
        return `<div style="width:150px">
          <div style="aspect-ratio:12/5;background:var(--chip);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">
            ${cur?`<img src="${cur}" style="width:100%;height:100%;object-fit:cover">`:"No image"}
          </div>
          <input type="file" accept="image/*" data-banner="${n}" data-lang="${lang}" style="margin-top:6px;font-size:12px;width:100%">
          ${cur?`<button class="small-btn danger" data-rmbanner="${n}" data-lang="${lang}" style="margin-top:4px;width:100%">Remove</button>`:""}
          ${pendingBanners.has(pk)?`<div style="font-size:11px;color:var(--marigold);margin-top:2px">Not saved yet</div>`:""}
        </div>`;
      }).join("");
      wrap.querySelectorAll("[data-banner]").forEach(inp=>{
        // Only stages the photo locally (preview + pending flag) — nothing is sent to the sheet
        // until "Save banners" is clicked. This also lets Save give one honest confirmation instead
        // of a toast that fires before we actually know the upload landed.
        inp.onchange=async e=>{
          const n=Number(inp.dataset.banner), lg=inp.dataset.lang, f=e.target.files[0]; if(!f) return;
          try{
            const dataUrl = await resizeImageFile_(f, 1200, 0.7);
            S.config[bannerKey(n,lg)]=dataUrl; save();
            pendingBanners.add(n+"_"+lg);
            renderBannerSlots();
          }catch(err){
            // Previously failed completely silently (an unhandled rejection) if the browser
            // couldn't decode the file — e.g. some PNG/JPEG exports from Canva/Photoshop use a
            // color profile or format variant <img> won't load. Now at least tells you.
            console.warn("ShopDukaanSe owner: couldn't read banner photo.", err);
            toast("Couldn't read that photo — re-export it as a plain JPG or PNG and try again");
            inp.value="";
          }
        };
      });
      wrap.querySelectorAll("[data-rmbanner]").forEach(btn=>{
        btn.onclick=()=>{
          const n=Number(btn.dataset.rmbanner), lg=btn.dataset.lang;
          S.config[bannerKey(n,lg)]=""; save();
          pendingBanners.add(n+"_"+lg);
          renderBannerSlots();
        };
      });
    });
  }
  renderBannerSlots();
  $("#saveBannersBtn").onclick=async ()=>{
    if(!pendingBanners.size){ toast("No banner changes to save"); return; }
    if(!apiConfigured()){ toast("Saved locally (local demo — connect the backend to go live)"); pendingBanners.clear(); renderBannerSlots(); return; }
    const btn=$("#saveBannersBtn"); const keys=[...pendingBanners]; // "slot_lang" strings
    btn.disabled=true; btn.textContent="Saving…";
    // Each banner photo now goes to Drive (same as product photos) instead of being stuffed
    // as raw base64 into a Config sheet cell — that old approach is why banners never saved
    // even once: a resized banner photo is routinely 80,000+ base64 characters, and a single
    // Google Sheets cell hard-caps at 50,000 characters, so the save threw an error on the
    // server every time, invisibly (apiPostBig is a no-cors fire-and-forget POST). An empty
    // slot (Remove) is tiny, so that alone still goes straight through updateConfig. No sheet
    // columns to add for any of this — Config is just key/value rows, so banner_1_hi etc. are
    // simply new rows, written the first time they're saved.
    const wasCleared={};
    keys.forEach(pk=>{
      const [n,lg]=pk.split("_");
      const val=S.config[bannerKey(n,lg)]||"";
      wasCleared[pk]=!val;
      if(val) apiPostBig("uploadBannerPhoto", {slot:Number(n), lang:lg, data_url:val});
      else apiPostBig("updateConfig", {[bannerKey(n,lg)]:""});
    });
    // apiPostBig can't read its own response (see its comment), so the only honest way to confirm
    // the sheet actually got the photo is to wait for it to finish writing, then re-fetch config
    // with a normal (small, readable) GET and check it actually changed.
    await new Promise(r=>setTimeout(r, 4000));
    try{
      const fresh = await apiGetAll();
      const ok = keys.filter(pk=>{
        const [n,lg]=pk.split("_");
        const v = fresh.config[bannerKey(n,lg)]||"";
        return wasCleared[pk] ? !v : v.indexOf("drive.google.com")!==-1;
      });
      const failed = keys.filter(pk=>!ok.includes(pk));
      const labelFor=pk=>{ const [n,lg]=pk.split("_"); return n+" "+(lg==="hi"?"Hindi":"English"); };
      if(ok.length){ ok.forEach(pk=>{ const [n,lg]=pk.split("_"); pendingBanners.delete(pk); const fv=fresh.config[bannerKey(n,lg)]; if(fv) S.config[bannerKey(n,lg)]=fv; }); save(); toast("Banner"+(ok.length>1?"s ":" ")+ok.map(labelFor).join(", ")+" saved"); }
      if(failed.length) toast("Banner"+(failed.length>1?"s ":" ")+failed.map(labelFor).join(", ")+" didn't save — try again (maybe a smaller photo)");
    }catch(err){
      console.warn("ShopDukaanSe owner: couldn't verify banner save.", err);
      toast("Sent, but couldn't confirm it saved — reopen this page in about 10 seconds to check");
    }
    btn.disabled=false; btn.textContent="Save banners";
    renderBannerSlots();
  };
  function syncVillages(){ save(); apiPostSafe("updateVillages", {villages:S.config.villages}); }
  $("#villRows").addEventListener("change", e=>{
    const tr=e.target.closest("tr"); if(!tr) return;
    const v=S.config.villages[+tr.dataset.i]; const f=e.target.dataset.f; if(!f) return;
    if(f==="lat"||f==="lng"||f==="radiusKm") v[f]=e.target.value===""?null:parseFloat(e.target.value);
    else v[f]=e.target.value;
    syncVillages();
  });
  $("#villRows").addEventListener("click", e=>{
    const b=e.target.closest("[data-del]"); if(!b) return;
    S.config.villages.splice(+b.dataset.del,1); syncVillages(); renderOwner();
  });
  $("#addVillage").onclick=()=>{
    S.config.villages.push({id:"v"+Date.now(), name:"New village", nameHi:"", pincode:"", lat:SHOP_LOC.lat, lng:SHOP_LOC.lng, radiusKm:3, tier:"next"});
    syncVillages(); renderOwner();
  };
  $("#cutoffIn").onchange=async ()=>{
    S.config.cutoffHour=Math.max(0,Math.min(23,parseInt($("#cutoffIn").value)||DEFAULT_CUTOFF_HOUR));
    save();
    await apiPostConfirmed("updateConfig", {cutoff_hour:S.config.cutoffHour}, "Cutoff time saved", "Cutoff time couldn't be saved to the sheet — try again");
  };
  $("#saveRules").onclick=async ()=>{
    save();
    if(!apiConfigured()){ toast("Saved — the customer app sees this immediately (same browser, local demo)."); return; }
    const [cfgRes, villRes] = await Promise.all([
      apiPostSafe("updateConfig", {cutoff_hour:S.config.cutoffHour}),
      apiPostSafe("updateVillages", {villages:S.config.villages})
    ]);
    toast((cfgRes && villRes) ? "Saved to the sheet — the customer app will see this on its next load." : "Saved here, but the sheet didn't confirm it — try again");
  };
}

/* ================= Boot ================= */
/* No login anymore — this page opens straight into the console. Access is controlled by ?key=
   (a private owner_key, resolved below) being unlisted, not by the page's URL itself (now a SHARED
   page for every shop) — see Code.gs's requireOwner_ for the server-side side of this change. */
(async function boot(){
  try{ await resolveShopFromOwnerKey(); }catch(err){ console.error("ShopDukaanSe owner:", err); return; }
  STORE_KEY = "sdse_shop_" + SHOP_ID + "_v1"; // same formula catalogue.html uses for this shop
  document.title = "ShopDukaanSe — Shop Owner";
  const loadingEl=document.createElement("div");
  loadingEl.id="bootLoading";
  loadingEl.style.cssText="position:absolute;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px";
  loadingEl.textContent="Loading…";
  $("#app").appendChild(loadingEl);
  await loadFromApi();
  loadingEl.remove();
  renderOwner();
  document.title = SHOP.name + " — Shop Owner";
})();
</script>
</body>
