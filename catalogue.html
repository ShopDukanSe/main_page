<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Geeta Dresses Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: phone-frame app, Pipariya-only. Home (search + circular quick-cats + category grid) → sub-category step → vertical reel feed → My Orders → bottom sheets.
   Tabbar + cart strip persist across every customer screen, including the feed. A search icon on the feed/orders headers opens a reusable search sheet.
   Geofencing: PIN code narrows to matching villages (pick one, done) → "share my location" fallback checks GPS against each village's OWN center+radius (no shared zone).
   Hindi/English toggle throughout. Owner/ops console lives in the separate owner.html, sharing this page's localStorage (STORE_KEY) — see S.config for owner-editable delivery rules. */
:root{
  /* --wine/--rose used to be maroon tones and drive nearly every border/button/accent color in
     the app. First pass pointed these at the same dark bottle-green used in the "order before
     4 PM" banner, but that particular green read as almost black across this much text/border
     — faded a notch and tuned to sit right next to the Shop Dukan Se logo's green (#0d6758),
     just a little darker than the logo rather than near-black. */
  --wine:#0b574a; --rose:#15a88f; --gold:#c08a2e; --marigold:#c08a2e; --madder:#ab3326; --leaf:#2f7d4f; --teal:#1f8f82;
  --cream:#fbf4ec; --brandgreen:#0d6758;
  --bg:#ffffff; --surface:#ffffff; --fg:#2a1a22; --muted:#7a6a6f; --line:#ece0d4; --chip:#f6ebdd;
  --sheet:#fffdfb; --overlay:rgba(24,8,14,.6);
  --display:"Yatra One","Mukta",Georgia,serif; --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
/* NOTE: this app used to auto-switch to a dark palette whenever the VISITOR's phone/browser was
   set to dark mode (a @media (prefers-color-scheme: dark) block previously lived here). That's
   why the site could look like a near-black page with a maroon border and white-on-dark text on
   some phones — it wasn't a bug in any one screen, the whole page was silently flipping into an
   unfinished dark theme nobody asked for. This app has one deliberate look (white + wine/maroon +
   gold), shown the same way to every customer regardless of their device's theme setting. */
:root[data-theme="dark"]{--bg:#191216; --surface:#251a1f; --fg:#f6ece7; --muted:#c3aeb4; --line:#3d2b31; --chip:#32232a; --sheet:#251a1f; --teal:#3fd6c8; --gold:#e0b357; --marigold:#e0b357; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.view{position:absolute;inset:0;overflow-y:auto}
.demo-tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--chip);border:1px solid var(--gold);color:var(--wine);padding:3px 10px;border-radius:99px;font-weight:700}
a{color:#fff}

/* Hero / home */
.hero{background:var(--surface);padding:14px 16px 10px;position:relative}
.brandlogo{display:flex;border:0;background:none;padding:0;cursor:pointer}
.brandlogo img{display:block;height:34px;width:auto}
.searchbar{position:relative;margin-top:14px}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.searchbar input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 38px;font-size:14px;box-shadow:0 4px 14px rgba(30,5,15,.08)}
/* Compact strip under the header: shop name/proprietor line (maroon on white) + the
   Hindi/English toggle — both used to sit cramped into the big maroon hero banner up top;
   moved down here so the header itself stays small and just shows the logo + search. */
.shopstrip{padding:20px 16px;background:#fff;border-bottom:1px solid var(--line)}
.shopstrip p{margin:0;min-width:0}
.shopstrip p b{display:block;font-size:23px;font-weight:800;color:var(--wine);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopstrip p small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langtog{display:flex;border:1px solid var(--wine);border-radius:99px;overflow:hidden;font-size:12px;font-weight:700;flex:0 0 auto}
.langtog button{padding:5px 10px;background:none;border:0;color:var(--wine);opacity:.6}
.langtog button.on{background:var(--wine);color:#fff;opacity:1}
.owner-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
.searchresults{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:9;max-height:260px;overflow-y:auto}
/* .hitrow is the shared compact "search result row" look (thumbnail + name + price), applied
   directly on each row button so it renders correctly wherever a result list is shown — the
   home dropdown (.searchresults), AND the feed/orders search sheet (#sheetSearchResults). It
   used to be scoped as "#.searchresults button/img/..." only, so the exact same markup dropped
   into the search SHEET had none of this styling — buttons fell back to plain block elements
   and photos rendered at full natural size (one giant uncropped photo filling the sheet) instead
   of a compact scrollable list. That's what made sheet search look "broken".  */
.hitrow{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.hitrow img{width:38px;height:48px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.hitrow .sr-meta{font-size:13px;min-width:0}
.hitrow .sr-meta div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.banner{margin:10px 16px 0;background:linear-gradient(90deg,#1c3b2e,#2f7d4f);color:#fff;border-radius:14px;padding:11px 14px;font-size:13px;font-weight:600;box-shadow:0 10px 22px rgba(20,60,40,.26);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:8px;position:relative;z-index:3}
.promo-rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:12px 16px 2px;scrollbar-width:none}
.promo-rail[hidden]{display:none} /* same `hidden`-vs-`display:flex` cascade issue as .cartstrip above */
.promo-rail::-webkit-scrollbar{display:none}
.promo-rail img{flex:0 0 86%;scroll-snap-align:center;border-radius:14px;width:86%;aspect-ratio:12/5;object-fit:cover;box-shadow:0 8px 18px rgba(20,10,15,.18)}
.subcta{position:absolute;left:8px;right:8px;bottom:68px;z-index:16}
.subcta .cta{width:100%;box-shadow:0 6px 18px rgba(30,5,15,.3)}
body.sheet-open .cartstrip,body.step-sub .cartstrip{display:none}

.quickcats{display:flex;gap:16px;overflow-x:auto;padding:4px 2px}
.qc{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;flex:0 0 auto}
.qc .ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--gold),var(--wine));box-shadow:0 3px 8px rgba(40,10,25,.15)}
.qc .ring>img{border:2px solid var(--surface)}
.qc img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.qc span{font-size:12px;font-weight:600;color:var(--brandgreen)}

.land{padding:16px 16px 190px;display:flex;flex-direction:column;gap:20px}
.sec-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{border-radius:18px;overflow:hidden;background:var(--surface);padding:0;text-align:left;position:relative;box-shadow:0 6px 18px rgba(40,10,25,.16);aspect-ratio:4/3;display:block}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.cat:active img{transform:scale(1.04)}
.cat[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--gold), 0 6px 18px rgba(40,10,25,.16)}
.catlabel{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(20,6,12,.8));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.catlabel b{font-weight:700;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.catlabel small{font-size:10.5px;background:rgba(255,255,255,.2);backdrop-filter:blur(2px);padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.tagrow{position:absolute;top:9px;left:9px;display:flex;gap:4px;z-index:2}
.reel .tagrow{top:calc(64px + env(safe-area-inset-top,0px));left:12px}
.reel .offribbon{top:calc(64px + env(safe-area-inset-top,0px))}
.tag-pill{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.tag-best{background:var(--wine);color:#fff}
.tag-new{background:var(--teal);color:#fff}
.offribbon{position:absolute;top:9px;right:0;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:3px 10px 3px 9px;border-radius:7px 0 0 7px;box-shadow:-2px 2px 8px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
.cta-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cta{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--wine),var(--rose));color:#fff;font-weight:700;font-size:16px;letter-spacing:.01em;box-shadow:0 6px 16px rgba(11,87,74,.32)}
.cta:disabled{opacity:.4;cursor:default;box-shadow:none}
.cta.alt{background:linear-gradient(135deg,var(--gold),#e0b357);color:#3a2306;box-shadow:0 6px 16px rgba(192,138,46,.32)}
.cta.ghost{background:var(--chip);color:var(--fg);box-shadow:none}
.foot-link{text-align:center;font-size:13px;color:var(--muted);text-decoration:underline;background:none;border:0;padding:6px}
.trustrow{display:flex;gap:8px;flex-wrap:wrap}
.trust{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.trust svg{width:15px;height:15px;stroke:var(--leaf);fill:none;stroke-width:2.2}

/* Bottom chrome: tabbar + cart strip + feed back FAB */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
.tabbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button img{width:21px;height:21px;border-radius:5px}
.tabbar button.active{color:var(--rose)}
.tabbar .badge{position:absolute;top:2px;right:22%;background:var(--marigold);color:#2a1d00;font-size:10px;font-weight:700;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tabbar .badge[hidden]{display:none} /* same `hidden`-vs-`display:flex` cascade issue as .cartstrip above */
.cartstrip{position:absolute;left:8px;right:8px;z-index:16;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--wine),var(--rose));color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(30,5,15,.3)}
/* This is the actual "maroon line/bar fixed throughout the page" bug: the cart strip sets its
   own `display:flex` above, which (by normal CSS cascade rules) overrides the browser's built-in
   `[hidden]{display:none}` — so setting strip.hidden=true in JS silently did nothing, and with no
   top/bottom offset applied yet it defaulted to sitting at the very top of every screen, full
   width. It went unnoticed before because it's nearly the same maroon as the old hero section
   right behind it; now that the header is white it was glaringly obvious. This rule restores
   `hidden` actually hiding it. */
.cartstrip[hidden]{display:none}
.cartstrip b{font-size:15px}
.cartstrip span{opacity:.85;font-size:12px}
.cartstrip button{margin-left:auto;background:#fff;color:var(--wine);border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}

/* Grid (paginated product browse) */
.gridwrap{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 4px 12px rgba(40,10,25,.08);position:relative}
.gcard img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.gcard .goff{position:absolute;top:8px;right:0;background:var(--gold);color:#fff;font-size:10.5px;font-weight:800;padding:2px 9px 2px 8px;border-radius:7px 0 0 7px}
.gcard .gbody{padding:8px 10px 10px}
.gcard .gname{font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gprice{font-size:13px;margin-top:3px}
.gcard .gprice s{color:var(--muted);font-weight:400;margin-left:4px;font-size:11.5px}
.gcard .gout{font-size:11px;font-weight:700;color:var(--madder);margin-top:3px}
.gridmore{grid-column:1/-1;display:flex;justify-content:center;padding:14px 0}
.gridmore button{border:1px solid var(--wine);background:var(--chip);color:var(--wine);border-radius:99px;padding:10px 22px;font-weight:700;font-size:14px}
.gridempty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

/* Feed */
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;overscroll-behavior:contain}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff}
.photos{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
/* Moved out of the top of the photo (where it used to sit right over the model's face) and
   into the caption block, just above the "N photos, swipe sideways" line — see .info/.hint. */
.dots{display:flex;gap:5px;pointer-events:none;margin:0 0 6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff;width:16px;border-radius:4px}
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff}
.topbar button{background:rgba(255,255,255,.16);border:0;border-radius:99px;padding:6px 12px;font-size:14px;color:#fff;backdrop-filter:blur(6px)}
/* The feed used to have a SECOND, floating "back" button (fab-back) near the bottom-left that
   sat right on top of the product title — removed. This one, already at the top, is now the
   only back control: made bigger and yellow (marigold) so it's clearly the thing to tap. */
#backLand{background:var(--marigold);color:#2a1d00;font-weight:700;font-size:15px;padding:9px 16px}
.topbar .crumb{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-pill b{background:var(--marigold);color:#2a1d00;border-radius:99px;padding:0 6px;margin-left:4px;font-size:12px}
.info{position:absolute;left:0;right:72px;bottom:0;padding:16px 16px calc(78px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.75) 40%);pointer-events:none}
/* The persistent tabbar (and, when the bag has items, the cart strip above it) sit over the
   feed's bottom edge — push the caption and action rail up enough to clear them. */
body.cart-chrome .info{padding-bottom:calc(142px + env(safe-area-inset-bottom,0px))}
.info>*{pointer-events:auto}
.info .sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.info h2{margin:2px 0 4px;font-size:21px;line-height:1.2}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price .now{font-size:22px;font-weight:700}
.price s{opacity:.7}
.price .off{color:var(--marigold);font-weight:700}
.info .hint{font-size:13px;opacity:.85;margin-top:4px}
.stockline{font-size:12px;font-weight:700;margin-top:4px}
.stockline.low{color:var(--marigold)}
.stockline.out{color:#ff8a80}
.rail{position:absolute;right:8px;bottom:calc(82px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
body.cart-chrome .rail{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
.rbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rbtn .ic{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;backdrop-filter:blur(6px)}
.rbtn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn.liked .ic{background:var(--madder)} .rbtn.liked svg{fill:#fff}
.rbtn.disliked .ic{background:#555}
.rbtn.bag .ic{background:var(--marigold)} .rbtn.bag svg{stroke:#2a1d00}
.rbtn.share .ic{background:var(--teal)}
.end{height:100%;scroll-snap-align:start;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;background:linear-gradient(160deg,var(--wine),var(--rose))}
.end h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 8px}

/* Sheets */
.scrim{position:absolute;inset:0;background:var(--overlay);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--sheet);color:var(--fg);border-radius:18px 18px 0 0;z-index:21;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .x{float:right;border:0;background:var(--chip);border-radius:99px;width:32px;height:32px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:14px}
.specs dt{color:var(--muted)} .specs dd{margin:0}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px}
.qa{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.qa b{display:block}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.size{min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:600;position:relative}
.size[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
.size[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.sizehint{font-size:12px;color:var(--marigold);font-weight:600;min-height:1.2em;margin-bottom:10px}
.share-row{display:flex;gap:8px;margin:10px 0}
.share-row button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.share-row button.wa{background:#25d366;border-color:#25d366;color:#07310f}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line-item img{width:56px;height:70px;object-fit:cover;border-radius:8px}
.line-item .meta{min-width:0;font-size:14px}
.line-item .meta div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.tot{display:flex;justify-content:space-between;padding:12px 0;font-weight:700;font-variant-numeric:tabular-nums}
form{display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.villagewrap{display:flex;gap:8px}
.villagewrap select{flex:1}
.locbtn{border:1px solid var(--wine);background:var(--chip);color:var(--wine);border-radius:10px;padding:0 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.eta{border-radius:12px;padding:10px 12px;font-size:14px;border:1px dashed var(--line)}
.eta.ok{border-color:var(--leaf);color:var(--leaf)} .eta.bad{border-color:var(--madder);color:var(--madder)} .eta.warn{border-color:var(--marigold);color:#8a5b00}
.upi-pref{border:2px solid var(--wine);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.upi-pref small{color:var(--leaf);font-weight:600}
.upi-box{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:14px}
#qr{background:#fff;padding:10px;border-radius:10px}
#qr img,#qr canvas{display:block}
.oid{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--chip);padding:4px 10px;border-radius:8px;letter-spacing:.04em}
.copy{border:0;background:none;color:var(--wine);font-weight:600;font-size:13px}
.done{text-align:center;padding:16px 0}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:32px}
.err{color:var(--madder);font-size:13px;min-height:1em}
details.emailprev{border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;margin-top:10px}
details.emailprev summary{cursor:pointer;font-weight:600;font-size:13px}
.emailbox{font-size:13px;margin-top:8px;background:var(--chip);border-radius:10px;padding:10px}
.emailbox .hdr{color:var(--muted);margin-bottom:4px}
.invoice{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.6;text-align:left}
.agree{flex-direction:row;align-items:flex-start;gap:8px;font-size:13px;color:var(--fg)}
.agree input{width:auto;margin-top:3px}
.cod-link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0;align-self:center}
.policy{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.policy b{color:var(--fg)}

/* My Orders */
.orders-wrap{padding:16px 16px 190px;display:flex;flex-direction:column;gap:16px}
.orders-wrap h2{margin:0;font-size:20px}
.lookup{display:flex;gap:8px}
.lookup input{flex:1}
.lookup button{border:0;background:linear-gradient(135deg,var(--wine),var(--rose));color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
.order-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.order-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.order-card .top b{font-family:ui-monospace,Menlo,monospace}
.stepper{display:flex;align-items:center;gap:0}
.step{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative}
.step .dot{width:14px;height:14px;border-radius:50%;background:var(--chip);border:2px solid var(--line);margin:0 auto 4px}
.step.on .dot{background:var(--leaf);border-color:var(--leaf)}
.step.now .dot{background:var(--marigold);border-color:var(--marigold)}
.step::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:-1}
.step:first-child::before{display:none}
.step.on::before{background:var(--leaf)}
.cancelled-banner{background:color-mix(in srgb,var(--madder) 14%,transparent);color:var(--madder);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.otp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:10px;padding:6px 10px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.mini-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.mini-btn.danger{color:var(--madder);border-color:var(--madder)}
.inline-confirm{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--chip);border-radius:10px;padding:8px 10px}
.issue-form{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.radio-row{display:flex;gap:14px;font-size:13px}
.radio-row label{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}
.radio-row input{width:auto}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.issue-pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;display:inline-block}

/* Shared status pills (used by customer order cards / issue status) */
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600}
.p-ok{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.p-wait{background:color-mix(in srgb,var(--marigold) 25%,transparent);color:#8a5b00}
.p-bad{background:color-mix(in srgb,var(--madder) 18%,transparent);color:var(--madder)}
.p-cod{background:var(--chip);color:var(--fg)}
:root[data-theme="dark"] .p-wait{color:var(--marigold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-wait{color:var(--marigold)}}
.step-head{display:flex;align-items:center;gap:10px}
.step-head h2{margin:0;font-size:18px;flex:1;color:var(--fg)}
.step-head .owner-btn{padding:6px 12px}
.step-dots{display:flex;gap:4px}.step-dots i{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}.step-dots i.on{background:var(--marigold)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;z-index:40;white-space:nowrap;max-width:88%;text-align:center}
/* Custom pull-to-refresh indicator. The app's outer page never scrolls (body{overflow:hidden},
   each .view scrolls on its own), so the phone's native pull-to-refresh gesture never has
   anything to pull — it silently does nothing. This re-implements the gesture by hand: watched
   on #app, only armed when the active .view is already scrolled to its very top. */
#pullIndicator{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;height:50px;margin-top:-50px;font-size:13px;font-weight:600;color:var(--wine);z-index:30;transition:transform .15s ease,opacity .15s ease;opacity:0;pointer-events:none}
#pullIndicator.show{opacity:1}
#pullIndicator .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--wine);margin-right:8px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Search overlay (reused from feed/orders search icon) */
.searchsheet-input{position:relative}
body{margin:0}
</style>
</head>

<script>
/* ================= Config ================= */
// Generic placeholders only — every real value here gets overwritten per shop, first from the
// Directory (name/tagline, in resolveShopFromDirectory) and then from that shop's OWN Config sheet
// (applyRemoteConfig, below) once its data loads. This file is a shared repo used by every shop,
// so nothing shop-specific should ever be hardcoded here.
let SHOP = { name:"Shop", owner:"", upiId:"", upiName:"", phone:"", email:"", gstin:"" };
let _bannerAutoTimer=null; // home-screen banner auto-advance interval (see renderBanners)
let REMOTE_CONFIG=null; // kept so renderBanners() can re-run on a language switch without refetching
// Banners can now be uploaded separately per language in owner.html. Key shape in the Config
// sheet is banner_<slot>_<lang> (e.g. banner_1_en, banner_1_hi). Falls back to the OTHER
// language's banner, then to the old pre-migration banner_<slot> key, so a shop that hasn't
// uploaded language-specific banners yet (or just upgraded) still shows whatever it already has
// instead of a blank slot.
function bannerFor(config, n){
  // IMPORTANT: no fallback to the OTHER language's banner here. An earlier version of this did
  // `config["banner_"+n+"_"+LANG] || config["banner_"+n+"_"+other] || ...` to avoid ever showing
  // a blank slot — but that meant uploading ONLY a Hindi banner made it show to English visitors
  // too (and vice versa) the moment the matching language slot was empty. Each language now only
  // ever shows its OWN banner, falling back solely to the old pre-language banner_<n> value
  // (which was always shown to everyone, from before this per-language feature existed) — never
  // to the other language's photo.
  return config["banner_"+n+"_"+LANG] || config["banner_"+n] || "";
}
function renderBanners(){
  if(!REMOTE_CONFIG) return;
  const banners=[1,2,3].map(n=>bannerFor(REMOTE_CONFIG,n)).filter(Boolean);
  const rail=document.getElementById("promoRail");
  if(!rail) return;
  if(_bannerAutoTimer){ clearInterval(_bannerAutoTimer); _bannerAutoTimer=null; }
  if(banners.length){
    rail.innerHTML=banners.map(b=>`<img src="${b}" alt="Offer">`).join("");
    rail.hidden=false;
    // Auto-advance to the next banner every 10s when there's more than one — a manual swipe
    // just changes which one the interval scrolls away from next, nothing special needed.
    if(banners.length>1){
      let bIdx=0;
      _bannerAutoTimer=setInterval(()=>{
        bIdx=(bIdx+1)%banners.length;
        const imgs=rail.querySelectorAll("img");
        if(imgs[bIdx]) imgs[bIdx].scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
      }, 10000);
    }
  }
  else rail.hidden=true;
}
function applyRemoteConfig(config){
  if(!config) return;
  REMOTE_CONFIG=config;
  if(config.shop_name) SHOP.name=config.shop_name;
  if(config.owner_name) SHOP.owner=config.owner_name;
  if(config.upi_id) SHOP.upiId=config.upi_id;
  if(config.upi_name) SHOP.upiName=config.upi_name;
  if(config.phone) SHOP.phone=config.phone;
  if(config.email) SHOP.email=config.email;
  if(config.gstin) SHOP.gstin=config.gstin;
  if(config.cancel_window_hours!=null) CANCEL_WINDOW_HOURS = Number(config.cancel_window_hours)||CANCEL_WINDOW_HOURS;
  if(config.issue_report_window_hours!=null) ISSUE_WINDOW_HOURS = Number(config.issue_report_window_hours)||ISSUE_WINDOW_HOURS;
  renderBanners();
}
// Shared across EVERY ShopDukaanSe page (the marketplace home page and every shop's own
// catalogue.html) because they all sit on the same shopdukanse.github.io origin, so this one
// localStorage key is already visible everywhere — no cross-site handoff needed. Pick a language
// once, anywhere on the platform, and it stays picked everywhere.
const LANG_KEY = "sdse_lang";
/* ================= Real backend (Google Sheet via Apps Script Web App) ================= */
// Where the central ShopDukaanSe marketplace home page (home.html, GitHub Pages) lives, and its
// Directory API (same one home.html uses). Both are the same for every shop — this file is now
// ONE shared repo used by every shop, so nothing shop-specific is hardcoded below anymore.
const MARKETPLACE_URL = "https://shopdukanse.github.io/main_page/";
const DIRECTORY_API_URL = "https://script.google.com/macros/s/AKfycbyUwJdKLtoOmLYBTKPYkz7Oif0xVjsgq_JTHMzGYl64v64xbr4tsZQ1AnfUHYFy-zI/exec";
// Which shop to show is decided entirely by ?shop=<shop_id> in the URL (every shop's
// catalogue_url row in the Directory points here with its own ?shop=). resolveShopFromDirectory()
// fills these in once, at boot, BEFORE anything reads local storage or calls the API — see boot().
let SHOP_ID = "";
let API_URL = "";
let SELF_URL = "";
let STORE_KEY = "sdse_shop__unresolved"; // replaced with "sdse_shop_<id>_v1" once SHOP_ID resolves
function apiConfigured(){ return typeof API_URL==="string" && API_URL && !API_URL.includes("PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"); }
/* Reads ?shop= from the URL, looks that shop up in the central Directory (the same endpoint
   home.html's shop list uses), and fills in SHOP_ID/API_URL/SELF_URL/STORE_KEY/SHOP.name/tagline
   for it. Must finish before loadLocal() (needs STORE_KEY) or any API call (needs API_URL) runs —
   it is the very first thing boot() awaits. Shows a plain-language error and stops if the link has
   no ?shop= or the shop isn't a known active one, instead of silently showing the wrong shop. */
async function resolveShopFromDirectory(){
  const qp = new URLSearchParams(location.search);
  SHOP_ID = (qp.get("shop") || "").trim();
  function fail(msg){
    document.body.innerHTML = '<div style="max-width:420px;margin:60px auto;padding:0 24px;text-align:center;font-family:sans-serif;color:#555;line-height:1.5">'
      + '<p>' + msg + '</p><p><a href="' + MARKETPLACE_URL + '" style="color:#0d6758;font-weight:700">Go to ShopDukaanSe →</a></p></div>';
  }
  if(!SHOP_ID){ fail("This link is missing its shop. Please use the link your shop shared with you."); throw new Error("no ?shop= in URL"); }
  STORE_KEY = "sdse_shop_" + SHOP_ID + "_v1";
  SELF_URL = location.origin + location.pathname + "?shop=" + encodeURIComponent(SHOP_ID);
  let row;
  try{
    // shopLookup is a direct, no-fan-out read of this one shop's Directory row — it does NOT make
    // the Directory call out to every other shop's own API just to answer "where is shop X",
    // unlike fetching the full shop list, so opening this page stays fast as more shops are added.
    const res = await fetch(DIRECTORY_API_URL + "?type=shopLookup&shop=" + encodeURIComponent(SHOP_ID));
    const data = await res.json();
    row = (data && data.ok) ? data : null;
  }catch(e){ /* fall through to the not-found message below */ }
  if(!row){ fail("This shop could not be found right now. Please check the link or try again in a moment."); throw new Error("unknown or unreachable shop_id: " + SHOP_ID); }
  API_URL = row.apiUrl || "";
  if(row.name) SHOP.name = row.name;
  if(row.tagline) SHOP.tagline = row.tagline;
}
function marketplaceHandoffUrl(){
  const lovedCount = Object.values(S.votes||{}).filter(v=>v==="like").length;
  const bagCount = S.cart.reduce((a,c)=>a+c.qty,0);
  // Exclude the local demo/fixture orders (sample:true, seeded for offline testing) — only a
  // real order this device actually placed should make the central "Orders" shortcut light up.
  const hasOrders = (S.orders||[]).some(o=>!o.sample);
  const p = new URLSearchParams({
    shop: SHOP_ID, name: SHOP.name, url: SELF_URL,
    bag: String(bagCount), loved: String(lovedCount), orders: hasOrders?"1":"0"
  });
  return MARKETPLACE_URL + (MARKETPLACE_URL.includes("?")?"&":"?") + p.toString();
}
function loadPlatformLogo(){
  if(!DIRECTORY_API_URL || DIRECTORY_API_URL.indexOf("PASTE_YOUR")===0) return;
  fetch(DIRECTORY_API_URL + "?type=platform").then(r=>r.json()).then(data=>{
    const url = data && data.ok && data.platform && data.platform.logo_url;
    if(url) document.querySelectorAll(".brandlogo img").forEach(img=>img.src=url);
  }).catch(()=>{});
}
// If a shop's own tab/orders/bag shortcut sent us here (?resume=bag|loved|orders), open that
// screen once the app has booted, instead of landing on the plain home screen.
function consumeResumeParam(){
  const qp = new URLSearchParams(location.search);
  const resume = qp.get("resume");
  if(!resume) return;
  qp.delete("resume"); // keep ?shop= (and anything else) — this is a shared, multi-shop page now
  history.replaceState({}, "", location.pathname + (qp.toString() ? "?"+qp.toString() : ""));
  if(resume==="bag") setTimeout(openCart, 300);
  if(resume==="loved") setTimeout(()=>openGrid(PRODUCTS.filter(p=>S.votes[p.id]==="like"), t("loved_title"), {mode:"loved"}), 300);
  if(resume==="orders") setTimeout(()=>go({screen:"orders"}), 300);
}
async function apiGetAll(){
  const res = await fetch(API_URL + (API_URL.includes("?")?"&":"?") + "action=all");
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
async function apiGetOrdersByPhone(phone, orderId){
  // Phone alone only gets a redacted summary back now (no name/address/email/items) — see the
  // matching doGet comment in Code.gs. Pass the customer's own Order ID (from their WhatsApp/
  // email confirmation) as a second factor to unlock full detail for that one order.
  let url = API_URL + (API_URL.includes("?")?"&":"?") + "action=orders&phone=" + encodeURIComponent(phone);
  if(orderId) url += "&orderId=" + encodeURIComponent(orderId);
  const res = await fetch(url);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
/* Sent as GET (not POST) because Apps Script Web App POST responses often come back without
   an Access-Control-Allow-Origin header once the page is hosted on a different origin (e.g.
   GitHub Pages) — the browser then blocks reading the response even though the call itself
   succeeds. GET doesn't have this problem, so the action+payload travels as a JSON query param.
   This is why a base64 photo must NEVER go through this function — see apiPostBig below. */
async function apiPost(action, payload){
  const url = API_URL + (API_URL.includes("?")?"&":"?") + "action=" + encodeURIComponent(action) + "&data=" + encodeURIComponent(JSON.stringify(Object.assign({action}, payload)));
  const res = await fetch(url);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
/* A base64 image (payment screenshot / issue photo) is far too big for a URL query string, so it
   silently failed via apiPost above. This sends it as a real POST body instead. mode:"no-cors" +
   text/plain avoids both the CORS-preflight problem and the CORS-response problem noted above:
   the request reaches Code.gs and executes fine, we just can't read its reply — fire-and-forget,
   called AFTER the order/issue row already exists (via a normal apiPost) so there's an id to
   attach the photo to. */
function apiPostBig(action, payload){
  if(!apiConfigured()) return;
  return fetch(API_URL, {
    method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({action}, payload))
  }).catch(err=>console.warn("Geeta Dresses: "+action+" (big) API failed.", err));
}

/* Real build: photo links come from a Google Sheet. Drive share links are converted to direct image URLs. */
function driveImg(url){ const m=String(url).match(/(?:\/d\/|id=)([\w-]{20,})/); return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`:url; }

/* Resizes/compresses an uploaded image file to a small JPEG data URL before sending it to
   the backend — a full-resolution phone photo easily exceeds Google Sheets' ~50,000-char-
   per-cell limit when base64-encoded; this keeps it well under that for both issue photos
   and payment screenshots. */
function resizeImageFile_(file, maxDim=900, quality=0.6){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
        const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const bgLayer = `<rect width="300" height="400" fill="${bg}"/><rect width="300" height="400" fill="url(#vg)"/>`;

    label = view==="front" ? "Front" : view==="back" ? "Back" : "Styled";
  }
  const tag = `<rect x="10" y="366" width="${label.length*5.4+42}" height="21" rx="10.5" fill="rgba(24,12,16,.5)"/><text x="21" y="380.5" font-family="Georgia, serif" font-size="10.5" fill="#fff" letter-spacing=".02em" opacity=".92">${label} · sample</text>`;

  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

   there is no single shared "zone" any more. tier is still just a delivery-speed label (same-day /

function haversineKm(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
// Villages whose OWN pincode matches what the customer typed.
function villagesForPincode(pin){ return S.config.villages.filter(v=>String(v.pincode||"").trim()===pin); }
// Finds which village's own center+radius contains this GPS point (nearest one, if more than one does).
function villageForLocation(loc){
  let best=null,bd=Infinity;
  for(const v of S.config.villages){
    if(v.lat==null||v.lng==null||!(Number(v.radiusKm)>0)) continue;
    const d=haversineKm(loc,v);
    if(d<=Number(v.radiusKm) && d<bd){ bd=d; best=v; }
  }
  return best;
}

   them over the local demo data. Always boots from loadLocal() first so the app works offline
   or before API_URL is deployed — a failed/placeholder fetch just leaves the demo data in place. */
async function loadFromApi(){
  loadLocal();
  if(!apiConfigured()) return;
  try{
    const data = await apiGetAll();
    if(data.products && data.products.length){ PRODUCTS = data.products.map(mapApiProduct); CAT_COVER = buildCatCover(); }
    if(data.stock && Object.keys(data.stock).length) S.stock = data.stock;
    if(data.villages && data.villages.length) S.config.villages = data.villages;
    if(data.config){
      applyRemoteConfig(data.config);
      if(data.config.cutoff_hour!=null) S.config.cutoffHour = Number(data.config.cutoff_hour)||S.config.cutoffHour;
    }
    applyRemotePolicies(data.policies);
    save();
  }catch(err){
    // NOTE: this falls back to the hardcoded Geeta Dresses demo catalogue below (PRODUCTS/
    // STOCK_SEED/DEFAULT_VILLAGES) regardless of which shop this actually is — fine for this
    // shop's own offline/dev testing, but worth replacing with a neutral "temporarily unavailable"
    // state before other shops go live, so a Code.gs hiccup never shows one shop a DIFFERENT
    // shop's demo products.
    console.warn("ShopDukaanSe (" + SHOP_ID + "): API unreachable, using local demo data.", err);
  }
}

const GRID_PAGE_SIZE = 18; // ~15-20 items per page, per request
let gridList=[], gridLabel="", gridShown=GRID_PAGE_SIZE, gridStateMode=null;
function openGrid(list, label, stateExtra){
  gridList=list; gridLabel=label; gridShown=GRID_PAGE_SIZE; gridStateMode=(stateExtra&&stateExtra.mode)||null;
  go(Object.assign({screen:"grid", label}, stateExtra||{mode:gridStateMode}));
  show("grid"); renderGrid(); syncChrome();
}
function restoreGridFromState(st){
  gridLabel = st.label || gridLabel;
  gridStateMode = st.mode || gridStateMode;
  if(st.mode==="cat") gridList = PRODUCTS.filter(p=>p.cat===st.cat && (!st.subs||!st.subs.length||st.subs.includes(p.sub)));
  else if(st.mode==="all") gridList = PRODUCTS;
  else if(st.mode==="search") gridList = filterProducts(st.q, true);
  else if(st.mode==="loved") gridList = PRODUCTS.filter(p=>S.votes[p.id]==="like");
  // else: no mode recorded (e.g. in-session nav right after openGrid) — keep whatever's already
  // in memory from the openGrid() call that pushed this state.
  gridShown = GRID_PAGE_SIZE;
  renderGrid();
  syncChrome();
}

// "Change size" on a bag line — lets the customer swap size without removing and re-adding
// the item. Reopens as a small size-picker sheet; picking a size moves the qty onto that size
// (merging into an existing line for that size if one's already in the bag), capped to stock.
function changeCartSize(i){
  const c=S.cart[i]; if(!c) return; const p=byId(c.id);
  sheet(`<button class="x" id="sx">✕</button><h3>${t("change_size")}</h3>
    <p style="font-size:14px;color:var(--muted)">${esc(pName(p))}</p>
    <div class="sizes" id="csz">${p.sizes.map(s=>{const n=stockFor(c.id,s);return `<button class="size" data-s="${s}" aria-pressed="${s===c.size}" ${n<=0?"disabled":""}>${s}</button>`}).join("")}</div>`);
  $("#sx").onclick=()=>openCart();
  $("#csz").onclick=e=>{
    const b=e.target.closest(".size"); if(!b||b.disabled) return;
    const newSize=b.dataset.s; if(newSize===c.size){ openCart(); return; }
    const avail=stockFor(c.id,newSize);
    const existing=S.cart.find(x=>x.id===c.id&&x.size===newSize);
    const moveQty=Math.min(c.qty, existing?Math.max(avail-existing.qty,0):avail);
    if(moveQty<=0){ toast(LANG==="hi"?"इस साइज में स्टॉक नहीं है":"No stock in that size"); return; }
    if(existing) existing.qty+=moveQty; else S.cart.push({id:c.id,size:newSize,qty:moveQty});
    c.qty-=moveQty; if(c.qty<=0) S.cart.splice(S.cart.indexOf(c),1);
    save(); syncChrome(); openCart();
  };
}

/* ================= Delivery ETA by village tier + 4 PM cutoff ================= */
const fmtD=d=>d.toLocaleDateString(LANG==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"short",weekday:"short"});
const fmtDT=iso=>new Date(iso).toLocaleString(LANG==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
function etaForVillage(v){
  if(!v) return {cls:"",text:t("eta_hint")};
  if(v.tier==="other") return {cls:"warn",text:t("eta_unknown")};
  const now=new Date(), cutoff=new Date(now); cutoff.setHours(S.config.cutoffHour,0,0,0);
  if(v.tier==="same"){
    if(now<=cutoff) return {cls:"ok",text:t("eta_same_ok")(LANG==="hi"?"रात 8 बजे":"8 PM")};
    return {cls:"warn",text:t("eta_same_late")};
  }
  const days=v.tier==="next"?1:2;
  const dt=new Date(); dt.setDate(dt.getDate()+days);
  return {cls:"ok",text:(v.tier==="next"?t("eta_next"):t("eta_next2"))(fmtD(dt))};
}
function newOrderId(){const d=new Date();const y=String(d.getFullYear()).slice(2),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `GD${y}${m}${dd}${Math.floor(1000+Math.random()*9000)}`}

let draft=null;
function openCheckout(){
  draft = draft||{name:"",phone:"",email:"",addr:"",villageId:"",mode:"UPI"};
  sheet(`<button class="x" id="sx" aria-label="Close">✕</button><h3>${t("checkout_title")}</h3>
    <form id="ck" novalidate>
      <label>${t("full_name")}<input id="f-name" value="${esc(draft.name)}" autocomplete="name" required></label>
      <label>${t("mobile")}<input id="f-phone" value="${esc(draft.phone)}" inputmode="tel" autocomplete="tel" required></label>
      <label>${t("email")}<input id="f-email" type="email" value="${esc(draft.email)}" autocomplete="email" required></label>
      <label>${t("address")}<textarea id="f-addr" rows="2" required>${esc(draft.addr)}</textarea></label>
      <label>${t("pin_label")}<input id="f-pincode" inputmode="numeric" maxlength="6" value="${esc(draft.pincode||"")}" placeholder="${t("pin_placeholder")}"></label>
      <div id="villageStepWrap"></div>
      <div class="eta" id="eta"></div>
      <p class="sec-label" style="margin:6px 0 0">${t("payment")}</p>
      <div class="upi-pref" id="payBox"></div>
      <div class="tot"><span>${t("checkout_title")==t("checkout_title")?t("total"):""}</span><span>${rs(cartTotal())}</span></div>
      <div class="policy">${policyHtml()}</div>
      <label class="agree"><input type="checkbox" id="f-agree"> ${t("agree")}</label>
      <div class="err" id="ckErr"></div>
      <button class="cta" type="submit" id="ckSubmit">${t("continue_pay")}</button>
      <button type="button" class="cod-link" id="codLink"></button>
    </form>`);
  $("#sx").onclick=closeSheet;
  const updEta=()=>{ const v=villageById(draft.villageId); $("#eta").className="eta "+(v?etaForVillage(v).cls:""); $("#eta").textContent = v?etaForVillage(v).text:t("eta_hint"); };
  // PIN code narrows the list to villages whose OWN pincode matches (pick one, done — no distance
  // check, we trust the pincode+name match). Re-rendered on every keystroke in the PIN box.
  function renderVillageStep(){
    const pin=$("#f-pincode").value.trim(); draft.pincode=pin;
    const wrap=$("#villageStepWrap");
    const matches = pin.length>=6 ? villagesForPincode(pin) : [];
    if(pin.length>=6 && !matches.length){
      wrap.innerHTML = `<div class="err">${t("pin_no_match")}</div>
        <button type="button" class="locbtn" id="shareLocBtn">${ICON.pin}${t("share_loc_cta")}</button>`;
    } else if(matches.length){
      wrap.innerHTML = `<label>${t("pick_village")}
          <select id="f-village">
            <option value="">${t("village_placeholder")}</option>
            ${matches.map(v=>`<option value="${v.id}" ${draft.villageId===v.id?"selected":""}>${villageName(v)}</option>`).join("")}
          </select>
        </label>
        <button type="button" class="locbtn" id="shareLocBtn">${ICON.pin}${t("share_loc_cta")}</button>`;
    } else {
      wrap.innerHTML = `<div style="font-size:12px;color:var(--muted)">${t("pin_hint")}</div>`;
    }
    const vSel=$("#f-village");
    if(vSel) vSel.onchange=()=>{ draft.villageId=vSel.value; updEta(); };
    const shareBtn=$("#shareLocBtn");
    if(shareBtn) shareBtn.onclick=useLocationFallback;
    updEta();
  }
  // Fallback when the customer can't find/select their village: checks their live GPS point
  // against EVERY village's own center+radius and picks whichever one contains them (nearest,
  // if more than one circle overlaps there). Doesn't touch the PIN/village dropdown above —
  // draft.villageId is what actually gets submitted either way.
  function useLocationFallback(){
    $("#eta").className="eta"; $("#eta").textContent=t("locating");
    if(!navigator.geolocation){ $("#eta").className="eta bad"; $("#eta").textContent=t("loc_denied"); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
      const match=villageForLocation(loc);
      if(match){ draft.villageId=match.id; updEta(); toast((LANG==="hi"?"मिल गया: ":"Matched: ")+villageName(match)); }
      else{ draft.villageId=""; $("#eta").className="eta bad"; $("#eta").textContent=t("outside_area"); }
    }, ()=>{ $("#eta").className="eta bad"; $("#eta").textContent=t("loc_denied"); }, {timeout:6000});
  }
  $("#f-pincode").oninput=renderVillageStep;
  renderVillageStep();
  const payUI=()=>{
    $("#payBox").innerHTML = draft.mode==="UPI" ? `<span><b>${t("upi_main")}</b></span><small>${t("upi_sub")}</small>` : `<span><b>${t("cod_main")}</b></span><small style="color:var(--muted)">${t("cod_sub")}</small>`;
    $("#ckSubmit").textContent = draft.mode==="UPI"?t("continue_pay"):t("place_cod");
    $("#codLink").textContent = draft.mode==="UPI"?t("cant_pay_online"):t("pay_upi_instead");
  };
  $("#codLink").onclick=()=>{draft.mode=draft.mode==="UPI"?"COD":"UPI";payUI()};
  payUI();
  let ckSubmitting=false;
  $("#ck").onsubmit=e=>{
    e.preventDefault();
    if(ckSubmitting) return;
    Object.assign(draft,{name:$("#f-name").value.trim(),phone:$("#f-phone").value.trim(),email:$("#f-email").value.trim(),addr:$("#f-addr").value.trim()});
    if(!draft.name||!/^\d{10}$/.test(draft.phone.replace(/\D/g,"").slice(-10))||!draft.addr){$("#ckErr").textContent=t("err_fill");return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email)){$("#ckErr").textContent=t("err_email");return}
    if(!draft.villageId){$("#ckErr").textContent=t("err_village");return}
    if(!$("#f-agree").checked){$("#ckErr").textContent=t("err_agree");return}
    for(const c of S.cart){ if(c.qty>stockFor(c.id,c.size)){ $("#ckErr").textContent=t("err_stock")(pName(byId(c.id)),c.size,stockFor(c.id,c.size)); return; } }
    const order={id:newOrderId(),at:new Date().toISOString(),name:draft.name,phone:draft.phone,email:draft.email,villageId:draft.villageId,addr:draft.addr,items:S.cart.map(c=>({...c})),amount:cartTotal(),mode:draft.mode,utr:"",status:draft.mode==="COD"?"COD":"Awaiting UTR",stage:"Booked"};
    if(draft.mode==="UPI"){ openUpi(order); return; }
    ckSubmitting=true; $("#ckSubmit").disabled=true; $("#ckSubmit").textContent=t("placing");
    placeOrder(order).finally(()=>{ckSubmitting=false;});
  };
}
function openUpi(order, fromPopstate){
  // Pushes a history entry so that if the customer hits the device/browser back button while
  // this payment screen is open, they land back on THIS SAME screen (see onpopstate above)
  // instead of being bounced elsewhere — avoids the "did my payment go through or not" confusion.
  if(!fromPopstate) history.pushState({screen:"pay", order}, "");
  const link=`upi://pay?pa=${encodeURIComponent(SHOP.upiId)}&pn=${encodeURIComponent(SHOP.upiName)}&am=${order.amount}&cu=INR&tn=${order.id}`;
  sheet(`<h3>${t("pay_title")(order.amount)}</h3>
    <div class="upi-box">
      <div>${t("order_id")} <span class="oid" id="oid">${order.id}</span> <button class="copy" id="cpy">${t("copy")}</button></div>
      <div id="qr" aria-label="UPI QR code"></div>
      <div class="pay-to" style="font-size:17px;font-weight:700;margin:8px 0 2px">${rs(order.amount)} <span style="font-weight:500;color:var(--muted);font-size:14px">${LANG==="hi"?"को भेजें":"to"}</span></div>
      <div style="font-size:16px;font-weight:700;letter-spacing:.01em">${SHOP.upiId}</div>
      <small style="color:var(--muted)">${t("scan_hint")}</small>
      <a href="${link}" class="copy" style="font-size:16px;font-weight:700;padding:13px">${t("open_upi")}</a>
    </div>
    <form id="utrF" style="margin-top:12px">
      <label>${t("utr_label")}<input id="f-utr" inputmode="numeric" maxlength="12" placeholder="e.g. 627812345671"></label>
      <div class="err" id="utrErr"></div>
      <label>${t("screenshot_label")}<input id="f-shot" type="file" accept="image/*"></label>
      <div id="shotPreview"></div>
      <button class="cta" type="submit" id="confirmPaidBtn">${t("confirm_paid")}</button>
      <button class="cta" type="button" id="backCk" style="background:var(--chip);color:var(--fg)">${t("back_btn")}</button>
    </form>`);
  try{ new QRCode($("#qr"),{text:link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ $("#qr").textContent=link; }
  $("#cpy").onclick=()=>{navigator.clipboard?.writeText(order.id).then(()=>toast(LANG==="hi"?"ऑर्डर ID कॉपी हुई":"Order ID copied")).catch(()=>{const r=document.createRange();r.selectNode($("#oid"));getSelection().removeAllRanges();getSelection().addRange(r)})};
  $("#backCk").onclick=()=>{ if(history.state && history.state.screen==="pay") history.replaceState({screen:"land",step:"cat"},""); openCheckout(); };
  let shotData="";
  $("#f-shot").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ shotData=await resizeImageFile_(f); $("#shotPreview").innerHTML=`<img src="${shotData}" style="max-width:120px;border-radius:8px;margin-top:6px">`; }
    catch(err){ console.warn("screenshot resize failed",err); }
  };
  let submitting=false;
  $("#utrF").onsubmit=e=>{e.preventDefault();
    if(submitting) return;
    const u=$("#f-utr").value.trim();
    if(u && !/^\d{12}$/.test(u)){$("#utrErr").textContent=t("utr_err");return}
    submitting=true; $("#confirmPaidBtn").disabled=true; $("#confirmPaidBtn").textContent=t("placing");
    order.utr=u;order.payment_screenshot=shotData;order.status="Pending check";
    placeOrder(order).finally(()=>{submitting=false;});
  };
}
function proformaText(order){
  const v=villageById(order.villageId);
  return `PROFORMA — ORDER CONFIRMATION (not a tax invoice)
${SHOP.name}, Pipariya
Order ID: ${order.id}        Date: ${fmtDT(order.at)}
Customer: ${order.name} · ${order.phone}
Deliver to: ${order.addr}, ${v?v.name:""}
------------------------------------------------
${order.items.map(i=>{const pr=byId(i.id);return `${pr.name} (${i.size}) x${i.qty}  ${rs(pr.price*i.qty)}`}).join("\n")}
------------------------------------------------
Total: ${rs(order.amount)}   Payment: ${order.mode}
${etaForVillage(v).text}
This confirms your booking. A GST tax invoice will be emailed when your order is delivered.`;
}
function invoiceText(order){
  let taxable=0, tax=0;
  const lines=order.items.map(i=>{const pr=byId(i.id); const rate=pr.gstRate||GST_RATE(pr.price); const base=pr.price*i.qty; const tv=base*rate/100; taxable+=base; tax+=tv;
    return `${pr.name} (${i.size}) x${i.qty}  HSN 6204  @${rate}% GST   ${rs(base)}`}).join("\n");
  const v=villageById(order.villageId);
  return `TAX INVOICE
${SHOP.name} — Prop. ${SHOP.owner}
GSTIN: ${SHOP.gstin}
Invoice No: INV-${order.id}   Date: ${fmtDT(order.deliveredAt||order.at)}
Bill/Ship to: ${order.name}, ${order.addr}, ${v?v.name:""}
------------------------------------------------
${lines}
------------------------------------------------
Taxable value: ${rs(taxable)}
CGST: ${rs(tax/2)}
SGST: ${rs(tax/2)}
Total: ${rs(taxable+tax)}
(GST rate and GSTIN shown are illustrative for this demo — confirm actual HSN code and rate with your CA once registered.)`;
}
async function placeOrder(order){
  // Clear the "pay" history trap (see openUpi) now that the order is actually going through —
  // otherwise a later back-press would incorrectly re-show the payment screen for an order
  // that's already placed.
  if(history.state && history.state.screen==="pay") history.replaceState({screen:"land",step:"cat"},"");
  if(apiConfigured()){
    try{
      const resp = await apiPost("placeOrder", {
        name:order.name, phone:order.phone, email:order.email, address:order.addr, village_id:order.villageId,
        payment_mode:order.mode, amount:order.amount, utr:order.utr||"",
        items: order.items.map(c=>({product_id:c.id, size:c.size, qty:c.qty, unit_price:byId(c.id).price}))
      });
      if(resp.order_id) order.id = resp.order_id;
      if(resp.cancel_window_ends_at) order.cancelWindowEndsAt = resp.cancel_window_ends_at;
      // Payment screenshot goes separately (see apiPostBig) — it's too big for the GET above.
      if(order.payment_screenshot && resp.order_id) apiPostBig("attachPhoto", {sheet:"Orders", id_field:"order_id", id:resp.order_id, field:"payment_screenshot", value:order.payment_screenshot});
    }catch(err){
      console.warn("Geeta Dresses: placeOrder API failed, saving locally only.", err);
    }
  }
  for(const c of order.items) S.stock[c.id][c.size]=Math.max(0,(S.stock[c.id][c.size]||0)-c.qty);
  S.orders.unshift(order); S.cart=[]; draft=null; save(); syncChrome();
  sheet(`<div class="done"><div class="tick">✓</div><h3>${t("order_placed")}</h3>
    <p>${t("order_id")} <span class="oid">${order.id}</span></p>
    <p style="color:var(--muted);margin:6px 0">${order.mode==="UPI"?t("utr_note")(order.utr):t("cod_note")(order.amount)}</p>
    <div class="eta ok" style="margin:10px 0">${etaForVillage(villageById(order.villageId)).text}</div>
    <div class="policy" style="text-align:left;margin-bottom:10px">${policyHtml()}</div>
    <details class="emailprev"><summary>${t("email_sent")(esc(order.email))}</summary>
      <div class="emailbox"><div class="hdr">To: ${esc(order.email)} · Subject: Your Geeta Dresses order ${order.id}</div><div class="invoice">${proformaText(order)}</div></div>
    </details>
    <p style="font-size:13px;color:var(--muted);margin-top:10px">${t("screenshot")}</p>
    <button class="cta" id="ok">${t("keep_browsing")}</button></div>`);
  $("#ok").onclick=closeSheet;
}

/* ================= My Orders (customer) ================= */
function stageIndex(o){ return o.stage==="Delivered"?2:o.stage==="Dispatched"?1:0 }
function cancellable(o){
  if(o.stage!=="Booked") return false;
  if(o.cancelWindowEndsAt) return Date.now() <= new Date(o.cancelWindowEndsAt).getTime();
  return (Date.now()-new Date(o.at).getTime()) <= CANCEL_WINDOW_HOURS*3600*1000;
}
function reportDeadline(o){
  if(o.reportDeadline) return new Date(o.reportDeadline).getTime();
  return o.deliveredAt ? new Date(o.deliveredAt).getTime()+ISSUE_WINDOW_HOURS*3600*1000 : null;
}
function hoursLeft(ms){ return Math.max(0, Math.ceil((ms-Date.now())/3600000)) }
function suggestResolution(order){
  const it=order.items[0];
  return stockFor(it.id,it.size)>0
    ? (LANG==="hi"?`उसी आइटम का एक्सचेंज, साइज ${it.size} (स्टॉक में है)।`:`Exchange for the same item, size ${it.size} (in stock).`)
    : (LANG==="hi"?"यह साइज स्टॉक में नहीं है — इसकी जगह रिफंड दिया जाएगा।":"Requested size is out of stock — refund instead.");
}
function renderOrdersView(){
  $("#ordersList").innerHTML = `<p style="color:var(--muted);font-size:13px">${t("ask_mobile")}</p>`;
  $("#lkHint").textContent = t("privacy_hint");
}
/* Maps one Orders-tab row (as returned by Code.gs's action=orders / action=all) into this page's order shape.
   A phone-only lookup now gets back a REDACTED summary (no .items array, has .itemCount instead) —
   mapped here into a `locked:true` shape so the card renderer can show just the safe basics and
   prompt for the Order ID to unlock full detail. */
function mapApiOrder(o){
  if(!o.items){
    return { id:o.id, at:o.placedAt, amount:o.amount, status:o.status, stage:o.status,
      itemCount:o.itemCount||0, dispatchedAt:o.dispatchedAt||"", deliveredAt:o.deliveredAt||"", cancelledAt:o.cancelledAt||"", locked:true };
  }
  const issue = (o.issues && o.issues[0]) || null;
  return {
    id:o.id, at:o.placedAt, name:o.name, phone:o.phone, email:o.email, villageId:o.villageId, addr:o.address,
    items:(o.items||[]).map(it=>({id:it.productId, size:it.size, qty:it.qty})),
    amount:o.amount, mode:o.paymentMode, utr:o.utr, status:o.status, stage:o.status,
    otp:o.otp, dispatchedAt:o.dispatchedAt, deliveredAt:o.deliveredAt,
    cancelWindowEndsAt:o.cancelWindowEndsAt, reportDeadline:(issue&&issue.reportDeadline)||null,
    issue: issue ? { type: issue.type==="Size issue"?"size":"defect", status: issue.status==="Pending"?"Under review":issue.status, resolution:issue.resolution, photos: issue.photoLink?[issue.photoLink]:[] } : null,
    locked:false
  };
}
$("#lookupForm").onsubmit=async e=>{
  e.preventDefault();
  const ph=lastDigits($("#lk-phone").value,10);
  if(!ph || ph.length<10){ $("#ordersList").innerHTML=`<p class="err">${t("invalid_mobile")}</p>`; return; }
  if(apiConfigured()){
    try{
      const data = await apiGetOrdersByPhone(ph);
      (data.orders||[]).map(mapApiOrder).forEach(o=>{
        const idx=S.orders.findIndex(x=>x.id===o.id);
        // Never let a redacted summary overwrite an order this session already unlocked in full.
        if(idx>=0){ if(!(o.locked && S.orders[idx].locked!==true)) S.orders[idx]=o; }
        else S.orders.unshift(o);
      });
      save();
    }catch(err){ console.warn("Geeta Dresses: orders lookup API failed, showing local data only.", err); }
  }
  const mine=S.orders.filter(o=>lastDigits(o.phone,10)===ph);
  if(!mine.length){ $("#ordersList").innerHTML=`<p style="color:var(--muted)">${t("none_found")}</p>`; return; }
  $("#ordersList").innerHTML = mine.map(orderCardHTML).join("");
  wireOrderCards();
};
function orderCardHTML(o){
  if(o.locked){
    const stageLbl2=(st)=>st==="Booked"?t("booked"):st==="Dispatched"?t("dispatched"):st==="Delivered"?t("delivered"):t("cancelled");
    return `<div class="order-card" data-id="${o.id}" data-locked="1">
      <div class="top"><div><b>${o.id}</b><div style="color:var(--muted);font-size:12px">${fmtDT(o.at)} · ${rs(o.amount)} · ${o.itemCount} ${LANG==="hi"?"आइटम":"item"+(o.itemCount>1?"s":"")}</div></div><span class="pill ${o.status==="Cancelled"?"p-bad":"p-cod"}">${stageLbl2(o.status)}</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input data-role="unlockId" placeholder="${t("orderid_ph")}" style="flex:1;min-width:140px">
        <button class="mini-btn" data-act="unlock">${t("unlock_btn")}</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:0">${t("enter_orderid")}</p>
      <div class="err" data-role="unlockErr"></div>
    </div>`;
  }
  const cancelOk=cancellable(o);
  const dl=reportDeadline(o); const within = dl && Date.now()<=dl;
  const v=villageById(o.villageId);
  const stageLbl=(st)=>st==="Booked"?t("booked"):st==="Dispatched"?t("dispatched"):st==="Delivered"?t("delivered"):t("cancelled");
  return `<div class="order-card" data-id="${o.id}">
    <div class="top"><div><b>${o.id}</b><div style="color:var(--muted);font-size:12px">${fmtDT(o.at)} · ${rs(o.amount)} · ${v?villageName(v):""}</div></div><span class="pill ${o.stage==="Cancelled"?"p-bad":"p-cod"}">${stageLbl(o.stage)}</span></div>
    ${o.stage==="Cancelled"?`<div class="cancelled-banner">${t("cancelled_note")}</div>`:`
    <div class="stepper">
      <div class="step ${stageIndex(o)>=0?"on":""} ${stageIndex(o)===0?"now":""}"><div class="dot"></div>${t("booked")}</div>
      <div class="step ${stageIndex(o)>=1?"on":""} ${stageIndex(o)===1?"now":""}"><div class="dot"></div>${t("dispatched")}</div>
      <div class="step ${stageIndex(o)>=2?"on":""} ${stageIndex(o)===2?"now":""}"><div class="dot"></div>${t("delivered")}</div>
    </div>`}
    ${o.stage==="Dispatched" ? `<div>${t("otp_line")()}<span class="otp-chip">${o.otp}</span></div>`:""}
    ${o.items.map(i=>`<div style="font-size:13px;color:var(--muted)">${pName(byId(i.id))} · ${i.size} × ${i.qty}</div>`).join("")}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="mini-btn" data-act="proforma">${t("proforma")}</button>
      ${o.stage==="Delivered"?`<button class="mini-btn" data-act="invoice">${t("invoice")}</button>`:""}
      ${cancelOk?`<button class="mini-btn danger" data-act="cancel">${t("cancel_order")}</button>`:""}
    </div>
    ${o.stage==="Delivered" && !o.issue && within ? `<div class="issue-form"><p class="sec-label" style="margin:0">${t("report_hdr")(hoursLeft(dl))}</p>
      <div class="radio-row"><label><input type="radio" name="itype-${o.id}" value="size" checked>${t("size_issue")}</label><label><input type="radio" name="itype-${o.id}" value="defect">${t("mfg_defect")}</label></div>
      <input type="file" accept="image/*" multiple data-role="issuephotos">
      <textarea rows="2" placeholder="${t("note_ph")}" data-role="issuenote"></textarea>
      <div class="err" data-role="issueErr"></div>
      <button class="cta ghost" data-act="submitIssue">${t("submit_report")}</button></div>`:""}
    ${o.stage==="Delivered" && !o.issue && !within ? `<p style="font-size:12px;color:var(--muted)">${t("window_closed")}</p>`:""}
    ${o.issue ? `<div class="issue-form"><span class="issue-pill ${o.issue.status==="Approved"?"p-ok":o.issue.status==="Rejected"?"p-bad":"p-wait"}" style="background:var(--chip)">${o.issue.type==="size"?t("size_issue"):t("mfg_defect")} — ${o.issue.status}</span>
      ${o.issue.status==="Under review"?`<p style="font-size:12px;color:var(--muted)">${t("under_review")}</p>`:`<p style="font-size:13px">${esc(o.issue.resolution||"")}</p>`}
      <div class="thumbs">${(o.issue.photos||[]).map(ph=>`<img src="${ph}" alt="">`).join("")}</div></div>`:""}
  </div>`;
}
function wireOrderCards(){
  document.querySelectorAll(".order-card").forEach(card=>{
    const id=card.dataset.id, o=S.orders.find(x=>x.id===id);
    card.onclick=e=>{
      const act=e.target.closest("[data-act]")?.dataset.act; if(!act) return;
      if(act==="unlock"){
        (async()=>{
          const oid=card.querySelector('[data-role="unlockId"]').value.trim();
          const errEl=card.querySelector('[data-role="unlockErr"]');
          if(!oid){ errEl.textContent=t("orderid_wrong"); return; }
          try{
            const ph=lastDigits($("#lk-phone").value,10);
            const data=await apiGetOrdersByPhone(ph, oid);
            const full=(data.orders||[]).map(mapApiOrder)[0];
            if(!full){ errEl.textContent=t("orderid_wrong"); return; }
            const idx=S.orders.findIndex(x=>x.id===full.id);
            if(idx>=0) S.orders[idx]=full; else S.orders.unshift(full);
            save();
            card.outerHTML=orderCardHTML(full);
            wireOrderCards();
          }catch(err){ errEl.textContent=t("orderid_wrong"); }
        })();
        return;
      }
      if(act==="proforma") sheet(`<button class="x" id="sx">✕</button><h3>${t("proforma")}</h3><div class="invoice">${proformaText(o)}</div>`), $("#sx").onclick=closeSheet;
      if(act==="invoice") sheet(`<button class="x" id="sx">✕</button><h3>${t("invoice")}</h3><div class="invoice">${invoiceText(o)}</div>`), $("#sx").onclick=closeSheet;
      if(act==="cancel"){
        card.querySelector('[data-act="cancel"]').outerHTML=`<div class="inline-confirm">${t("cancel_q")}<button class="mini-btn danger" data-act="cancelYes">${t("yes_cancel")}</button><button class="mini-btn" data-act="cancelNo">${t("keep_it")}</button></div>`;
      }
      if(act==="cancelYes"){
        (async()=>{
          if(apiConfigured()){
            try{ await apiPost("cancelOrder", {order_id:o.id, phone:o.phone}); }
            catch(err){ console.warn("Geeta Dresses: cancelOrder API failed, cancelling locally only.", err); }
          }
          for(const it of o.items) S.stock[it.id][it.size]=(S.stock[it.id][it.size]||0)+it.qty;
          o.stage="Cancelled"; save(); toast(t("cancelled_toast")); renderOrdersView(); $("#lookupForm").requestSubmit();
        })();
      }
      if(act==="cancelNo"){ renderOrdersView(); $("#lookupForm").requestSubmit(); }
      if(act==="submitIssue"){
        const type=card.querySelector(`input[name="itype-${id}"]:checked`).value;
        const note=card.querySelector('[data-role="issuenote"]').value.trim();
        const files=card.querySelector('[data-role="issuephotos"]').files;
        if(!files.length){ card.querySelector('[data-role="issueErr"]').textContent=t("need_photo"); return; }
        const readers=[...files].slice(0,3).map(f=>resizeImageFile_(f).catch(()=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})));
        Promise.all(readers).then(async photos=>{
          if(apiConfigured()){
            try{
              // Demo note: Code.gs just stores whatever string is sent in photo_link (meant for a
              // pasted Drive link) — here we pass the first captured photo as a data URL instead.
              // The photo itself goes separately via apiPostBig, same reasoning as placeOrder's
              // payment screenshot — a base64 image is too big for the GET request below.
              const resp = await apiPost("reportIssue", { order_id:o.id, type: type==="size"?"Size issue":"Manufacturing defect", note });
              if(photos[0] && resp.issue_id) apiPostBig("attachPhoto", {sheet:"Issues", id_field:"issue_id", id:resp.issue_id, field:"photo_link", value:photos[0]});
            }catch(err){ console.warn("Geeta Dresses: reportIssue API failed, saving locally only.", err); }
          }
          o.issue={type,note,photos,status:"Under review",at:new Date().toISOString()};
          save(); toast(t("reported_toast")); renderOrdersView(); $("#lookupForm").requestSubmit();
        });
      }
    };
  });
}

/* ================= Pull-to-refresh =================
   Custom touch-driven gesture (see the #pullIndicator CSS comment for why the native one
   doesn't fire here). Watches touches on #app; only "arms" when the currently-visible .view is
   already scrolled to the very top, so it never fights normal scrolling. */
function setupPullToRefresh(){
  const ind=$("#pullIndicator"), lbl=$("#pullLbl");
  let startY=0, dy=0, armed=false, busy=false;
  const activeView=()=>["land","feed","orders"].map(x=>$("#v-"+x)).find(v=>!v.hidden);
  const THRESH=64;
  document.getElementById("app").addEventListener("touchstart",e=>{
    if(busy || document.body.classList.contains("sheet-open")) return;
    const v=activeView(); if(!v || v.scrollTop>0){ armed=false; return; }
    startY=e.touches[0].clientY; dy=0; armed=true;
  },{passive:true});
  document.getElementById("app").addEventListener("touchmove",e=>{
    if(!armed || busy) return;
    dy=e.touches[0].clientY-startY;
    if(dy<=0){ ind.classList.remove("show"); ind.style.transform=""; return; }
    const pull=Math.min(dy*0.5, 90);
    ind.classList.add("show");
    ind.style.transform=`translateY(${pull}px)`;
    lbl.textContent = pull>=THRESH ? t("release_refresh") : t("pull_refresh");
  },{passive:true});
  document.getElementById("app").addEventListener("touchend",async()=>{
    if(!armed) return;
    const pull=Math.min(Math.max(dy,0)*0.5,90);
    armed=false;
    if(pull>=THRESH){
      busy=true; lbl.textContent=t("refreshing"); ind.style.transform="translateY(56px)";
      try{ await loadFromApi(); }catch(err){ console.warn("Geeta Dresses: pull-to-refresh fetch failed.", err); }
      if(history.state) applyState(history.state); else applyState({screen:"land",step:"cat"});
      lbl.textContent=t("refreshed");
      setTimeout(()=>{ ind.classList.remove("show"); ind.style.transform=""; busy=false; },700);
    } else {
      ind.classList.remove("show"); ind.style.transform="";
    }
  },{passive:true});
}

/* ================= Boot ================= */
(async function boot(){
  // Figure out WHICH shop this is (?shop=<id>, looked up in the central Directory) before touching
  // anything else — loadLocal() needs STORE_KEY and every API call needs API_URL, both of which
  // only exist after this resolves. Stops here (its own fail() already showed a message) if the
  // link has no ?shop= or the shop can't be found.
  try{ await resolveShopFromDirectory(); }catch(err){ console.error("ShopDukaanSe:", err); return; }
  // Read whatever was saved locally (including langChosen) BEFORE deciding whether to ask the
  // language question — this used to run loadLocal() only later, inside loadFromApi(), which is
  // AFTER askLangIfNeeded() checks S.langChosen. So that check always saw a blank, just-created
  // S object and asked every single time, even for a returning customer, even on a plain refresh.
  loadLocal();
  const loadingEl=document.createElement("div");
  loadingEl.id="bootLoading";
  loadingEl.style.cssText="position:absolute;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px";
  await askLangIfNeeded();
  loadingEl.textContent = LANG==="hi" ? "लोड हो रहा है…" : "Loading…";
  $("#app").appendChild(loadingEl);
  await loadFromApi();
  loadingEl.remove();
  document.querySelectorAll("#langtog button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  applyStaticLabels();
  const hashId=location.hash.slice(1);
  // A plain refresh (F5) keeps the browser's history.state for the current entry — so if the
  // customer was on the feed, cart, or orders view, resume there instead of always snapping back
  // to the home screen. Only a genuinely first-ever navigation (no state yet) starts at home.
  if(history.state && history.state.screen) applyState(history.state);
  else go({screen:"land",step:"cat"}, true);
  if(hashId && byId(hashId)) setTimeout(()=>openDetails(hashId),50);
  setupPullToRefresh();
  loadPlatformLogo();
  consumeResumeParam();
})();
